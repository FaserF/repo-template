name: Reusable OpenHands Issue & PR Resolver

on:
  workflow_call:
    inputs:
      target_number:
        description: "Optional Issue or PR number (used by workflow_dispatch)"
        type: string
        default: ""
      omniroute_base_url:
        description: "OmniRoute Base URL (falls back to secret OMNIROUTE_BASE_URL if omitted)"
        type: string
        default: ""
      model:
        description: "LLM Model (auto/coding or auto/smart)"
        type: string
        default: "auto/coding"
      max_iterations:
        description: "Maximum agent loop iterations"
        type: number
        default: 20
      timeout_minutes:
        description: "Timeout in minutes for OpenHands execution (default: 45)"
        type: number
        default: 45
      runner:
        description: "Runner environment ('ubuntu-latest', 'self-hosted', or 'auto')"
        type: string
        default: "auto"

jobs:
  resolve:
    name: OpenHands Autonomous Solver
    timeout-minutes: ${{ inputs.timeout_minutes || 45 }}
    if: |
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request' && !startsWith(github.event.workflow_run.head_branch, 'openhands/'))
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || ((inputs.runner == 'self-hosted' || github.event.repository.private == true || vars.FORCE_SELF_HOSTED_RUNNER == 'true' || vars.USE_SELF_HOSTED_RUNNERS == 'true' || vars.USE_GITHUB_RUNNERS == 'false') && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest') }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Generate GitHub App Bot Token
        id: app-token
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Resolve Target Context
        id: target
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const explicitNum = "${{ inputs.target_number }}".trim();
            let targetNum = 0;
            let isPR = false;
            let title = "";
            let body = "";
            let headRef = "";
            let baseRef = context.payload.repository?.default_branch || "main";
            let failedRunId = "";

            if (context.eventName === "workflow_run" && context.payload.workflow_run) {
              failedRunId = String(context.payload.workflow_run.id || "");
              const prs = context.payload.workflow_run.pull_requests || [];
              if (prs.length > 0) {
                targetNum = prs[0].number;
              } else if (context.payload.workflow_run.head_sha) {
                const { data: assoc } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: context.payload.workflow_run.head_sha,
                });
                const openPr = assoc.find(p => p.state === "open");
                if (openPr) targetNum = openPr.number;
              }
            } else if (explicitNum) {
              targetNum = parseInt(explicitNum, 10) || 0;
            } else if (context.payload.pull_request) {
              targetNum = context.payload.pull_request.number;
            } else if (context.payload.issue) {
              targetNum = context.payload.issue.number;
            }

            if (targetNum > 0) {
              const { data: issueData } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: targetNum,
              });
              isPR = Boolean(issueData.pull_request);
              title = issueData.title || "";
              body = issueData.body || "";
              if (isPR) {
                const { data: prData } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: targetNum,
                });
                headRef = prData.head.ref;
                baseRef = prData.base.ref;
              }
            }

            core.setOutput("number", String(targetNum));
            core.setOutput("is_pr", isPR ? "true" : "false");
            core.setOutput("title", title);
            core.setOutput("head_ref", headRef);
            core.setOutput("base_ref", baseRef);
            core.setOutput("failed_run_id", failedRunId);
            await github.rest.issues.get({ owner: context.repo.owner, repo: context.repo.repo, issue_number: targetNum }).catch(() => null);
            core.exportVariable("TARGET_BODY_FULL", body);

      - name: Abort cleanly if no open PR or Issue target found
        if: steps.target.outputs.number == '0'
        run: |
          echo "No target PR or Issue found for this event. Exiting."
          exit 0

      - name: Checkout Target Repository
        if: steps.target.outputs.number != '0'
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          ref: ${{ steps.target.outputs.head_ref || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Git Identity as faserf-hermes-agent[bot]
        if: steps.target.outputs.number != '0'
        run: |
          git config --global user.name "faserf-hermes-agent[bot]"
          git config --global user.email "342667397+faserf-hermes-agent[bot]@users.noreply.github.com"

      - name: Acknowledge Resolution Start
        if: steps.target.outputs.number != '0'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const targetNum = parseInt("${{ steps.target.outputs.number }}", 10);
            const isPR = "${{ steps.target.outputs.is_pr }}" === "true";
            const targetType = isPR ? "Pull Request" : "Issue";
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: targetNum,
                body: `> [!TIP]\n` +
                  `> 🛠️ **OpenHands Autonomous Solver Started (${targetType} #${targetNum})**  \n` +
                  `> **Engine:** \`${{ inputs.model }}\` via OmniRoute  \n` +
                  `> Inspecting logs/review comments, applying test-verified fixes, and validating checks.`
              });
            } catch (err) {
              console.warn(`Non-fatal acknowledge comment failure: ${err.message}`);
            }

      - name: Setup Python
        if: steps.target.outputs.number != '0'
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Execute Autonomous OpenHands Solver
        id: solver
        if: steps.target.outputs.number != '0'
        env:
          IS_PR: ${{ steps.target.outputs.is_pr }}
          TARGET_NUMBER: ${{ steps.target.outputs.number }}
          TARGET_TITLE: ${{ steps.target.outputs.title }}
          HEAD_REF: ${{ steps.target.outputs.head_ref }}
          BASE_REF: ${{ steps.target.outputs.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FAILED_RUN_ID: ${{ steps.target.outputs.failed_run_id }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_OPENHANDS_API_KEY || secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_BASE_URL: ${{ inputs.omniroute_base_url != '' && inputs.omniroute_base_url || secrets.OMNIROUTE_BASE_URL }}
          MODEL: ${{ inputs.model }}
          MAX_ITERATIONS: ${{ inputs.max_iterations }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          if [ -f scripts/openhands_resolver.py ]; then
            python3 scripts/openhands_resolver.py
          else
            curl -fsSL https://raw.githubusercontent.com/FaserF/repo-template/main/scripts/openhands_resolver.py -o /tmp/openhands_resolver.py
            python3 /tmp/openhands_resolver.py
          fi

      - name: Cleanup Ready Label & Post Summary
        if: always() && steps.target.outputs.number != '0'
        uses: actions/github-script@v9
        env:
          TARGET_NUM: ${{ steps.target.outputs.number }}
          RESOLVER_STATUS: ${{ steps.solver.outputs.resolver_status || 'blocked' }}
          RESOLVER_SUMMARY: ${{ steps.solver.outputs.resolver_summary || 'See workflow logs for details.' }}
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const targetNum = parseInt(process.env.TARGET_NUM || "0", 10);
            const status = process.env.RESOLVER_STATUS || "blocked";
            const summary = process.env.RESOLVER_SUMMARY || "See workflow logs for details.";
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: targetNum,
                name: "openhands:ready"
              });
            } catch (e) {}

            const badge = status === "resolved" ? "✅ **OpenHands Autonomous Resolution Complete**" :
                          status === "no_changes" ? "ℹ️ **OpenHands Inspection Complete (No Changes Needed)**" :
                          "⚠️ **OpenHands Autonomous Solver Blocked / Incomplete**";
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: targetNum,
                body: `> [!NOTE]\n> ${badge}  \n> ${summary}`
              });
            } catch (err) {
              console.warn(`Non-fatal summary comment failure: ${err.message}`);
            }
