name: Auto-Close Fixed Issues

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  close-fixed:
    name: Close Inactive Fixed Issues
    runs-on: ubuntu-latest
    steps:
      - name: Close issues marked as fixed with no user activity for 3 weeks
        uses: actions/github-script@v9
        with:
          script: |
            const THREE_WEEKS_MS = 21 * 24 * 60 * 60 * 1000;
            const now = Date.now();
            const MAINTAINER = context.repo.owner.toLowerCase();

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });

            for (const issue of issues) {
              if (issue.pull_request) continue;

              const hasFixedLabel = issue.labels.some((l) =>
                (typeof l === "string" ? l : l.name || "").toLowerCase().includes("fixed")
              );
              if (!hasFixedLabel) continue;

              let fixedLabeledTime = null;
              try {
                const events = await github.paginate(github.rest.issues.listEvents, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  per_page: 100,
                });

                for (const event of events) {
                  if (event.event === "labeled" && event.label && event.label.name.toLowerCase().includes("fixed")) {
                    const eventTime = new Date(event.created_at).getTime();
                    if (!fixedLabeledTime || eventTime > fixedLabeledTime) {
                      fixedLabeledTime = eventTime;
                    }
                  }
                }
              } catch (err) {
                console.warn(`Could not fetch events for #${issue.number}: ${err.message}`);
              }

              if (!fixedLabeledTime) {
                fixedLabeledTime = new Date(issue.created_at).getTime();
              }

              if (now - fixedLabeledTime < THREE_WEEKS_MS) {
                continue;
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              });

              const hasRecentUserComment = comments.some((c) => {
                const commentTime = new Date(c.created_at).getTime();
                const author = (c.user?.login || "").toLowerCase();
                const isIgnored = author === MAINTAINER || author.includes("bot");
                return commentTime > fixedLabeledTime && !isIgnored;
              });

              if (hasRecentUserComment) {
                continue;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "This issue has been marked as fixed for more than 3 weeks with no further activity. Closing automatically. 👋\n\nIf you still encounter this issue or have further questions, feel free to reopen or create a new issue.",
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
            }
