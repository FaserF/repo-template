name: Reusable Hermes Bot

on:
  workflow_call:
    inputs:
      omniroute_base_url:
        description: "OmniRoute Base URL (falls back to secret OMNIROUTE_BASE_URL if omitted)"
        type: string
        default: ""
      model:
        description: "OmniRoute Model (auto/coding or auto/smart)"
        type: string
        default: "auto/coding"
      runner:
        description: "Runner environment ('ubuntu-latest', 'self-hosted', or 'auto')"
        type: string
        default: "auto"

jobs:
  interactive-bot:
    name: Hermes Interactive Bot
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || ((inputs.runner == 'self-hosted' || secrets.FORCE_SELF_HOSTED_RUNNER == 'true' || vars.FORCE_SELF_HOSTED_RUNNER == 'true' || vars.USE_SELF_HOSTED_RUNNERS == 'true' || vars.USE_GITHUB_RUNNERS == 'false') && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest') }}
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Generate Bot Token
        id: app-token
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Process Interactive Command & Reactive Controls
        env:
          OMNIROUTE_BASE_URL: ${{ inputs.omniroute_base_url != '' && inputs.omniroute_base_url || secrets.OMNIROUTE_BASE_URL }}
          OMNIROUTE_MODEL: ${{ inputs.model }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const payload = context.payload;
            const comment = (payload.comment ? payload.comment.body : (payload.issue ? payload.issue.body : "")) || "";
            const isPR = Boolean(payload.issue && payload.issue.pull_request) || Boolean(payload.pull_request);
            const issueNumber = payload.issue ? payload.issue.number : (payload.pull_request ? payload.pull_request.number : 0);

            if (!issueNumber) return;

            const isReviewCmd = /@faserf-hermes-agent\s+(?:review|recheck|deep)|\/(?:review|recheck|deep)|\[x\]\s*(?:🔄\s*)?Request re-review/i.test(comment);
            const isResolveCmd = /@faserf-hermes-agent\s+resolve|\/resolve|\[x\]\s*(?:⚡\s*)?Auto-fix|\[x\]\s*(?:🛠️\s*)?Resolve with OpenHands/i.test(comment);
            const isPauseCmd = /\[x\]\s*(?:⏸️\s*)?Pause automated reviews|@faserf-hermes-agent\s+pause/i.test(comment);
            const isHelpCmd = /@faserf-hermes-agent\s+help|\/help/i.test(comment);

            if (!isReviewCmd && !isResolveCmd && !isPauseCmd && !isHelpCmd) {
              return;
            }

            // 1. Dynamic RBAC: Determine caller permissions strictly per repository via .github/hermes-repo.yml and GitHub API
            const sender = (payload.sender ? payload.sender.login : (payload.comment ? payload.comment.user.login : "")).toLowerCase();
            const association = (payload.comment ? payload.comment.author_association : "") || "";
            const repoOwner = context.repo.owner.toLowerCase();

            let configuredAdmins = [];
            let allowCollaborators = true;
            try {
              const res = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: ".github/hermes-repo.yml"
              });
              const rawCfg = Buffer.from(res.data.content, "base64").toString("utf-8");
              const adminMatch = rawCfg.match(/admins:\s*\n((?:\s*-\s*[\w\-]+\s*\n)+)/);
              if (adminMatch) {
                configuredAdmins = adminMatch[1].split("\n").map(l => l.replace(/[-\s]/g, "").toLowerCase()).filter(Boolean);
              }
              if (/allow_collaborators:\s*false/i.test(rawCfg)) {
                allowCollaborators = false;
              }
            } catch (e) {
              // File not present or unreadable - dynamically relies on repository permissions
            }

            if (!configuredAdmins.includes(repoOwner)) {
              configuredAdmins.push(repoOwner);
            }

            const isExplicitAdmin = configuredAdmins.includes(sender);
            const isCollab = allowCollaborators && ["OWNER", "MEMBER", "COLLABORATOR"].includes(association);
            let hasWritePerm = false;
            if (!isExplicitAdmin && !isCollab && allowCollaborators) {
              try {
                const permRes = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: sender
                });
                const perm = permRes.data ? permRes.data.permission : "none";
                hasWritePerm = ["admin", "write"].includes(perm);
              } catch (e) {}
            }

            const canExecuteCritical = isExplicitAdmin || isCollab || hasWritePerm;

            if (isHelpCmd) {
              const adminListText = configuredAdmins.length > 0 ? configuredAdmins.map(a => '@' + a).join(', ') : 'repository maintainers';
              const helpBody = `> [!NOTE]\n` +
                `> 🤖 **FaserF Hermes Agent Bot Commands & Permissions**  \n` +
                `> Provided by [faserf-hermes-agent[bot]](https://github.com/apps/faserf-hermes-agent)  \n\n` +
                `**Public Commands (Anyone):**\n` +
                `* \`@faserf-hermes-agent review\` (aliases: \`recheck\`, \`deep\`, \`/review\`, \`/recheck\`) — Trigger re-review & Repowise health analysis.\n` +
                `* PR title \`[skip hermes]\` / \`[skip review]\` — Skip automated review on this PR.\n` +
                `* \`@faserf-hermes-agent help\` — Display this command reference.\n\n` +
                `**Restricted Maintainer Actions (${adminListText}):**\n` +
                `* \`@faserf-hermes-agent resolve\` (or \`[x] ⚡ Auto-fix all findings\`) — Autonomous SWE agent solver (OpenHands).\n` +
                `* \`[x] ⏸️ Pause automated reviews\` — Pause automated bot evaluations.\n` +
                `* *Configured per-repository via \`.github/hermes-repo.yml\`.*`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: helpBody
              });
              return;
            }

            if (isResolveCmd) {
              if (!canExecuteCritical) {
                const adminListText = configuredAdmins.length > 0 ? configuredAdmins.map(a => '@' + a).join(', ') : 'repository maintainers';
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `> [!WARNING]\n` +
                    `> 🔒 **Permission Denied**  \n` +
                    `> Automated code resolution (\`@faserf-hermes-agent resolve\` / OpenHands) is restricted to configured maintainers (\`${adminListText}\`).  \n` +
                    `> Non-maintainers may still request reviews (\`@faserf-hermes-agent review\`) or ask maintainers to trigger auto-fixes.`
                });
                return;
              }

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ["openhands:ready"]
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `> 🤖 **OpenHands Dispatch:** Autonomous investigation scheduled for #${issueNumber} by @${sender}. OpenHands agent is spinning up.`
              });
              return;
            }

            if (isPauseCmd) {
              if (!canExecuteCritical) {
                const adminListText = configuredAdmins.length > 0 ? configuredAdmins.map(a => '@' + a).join(', ') : 'repository maintainers';
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `> [!WARNING]\n` +
                    `> 🔒 **Permission Denied**  \n` +
                    `> Pausing automated reviews is restricted to configured maintainers (\`${adminListText}\`).`
                });
                return;
              }

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ["ai-review-paused"]
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `> ⏸️ **Automated Reviews Paused:** Automated reviews on #${issueNumber} paused by @${sender}. Uncheck or run \`@faserf-hermes-agent review\` to resume.`
              });
              return;
            }

            if (isReviewCmd && isPR) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `> 🔍 **PR Review Triggered:** Re-evaluating pull request #${issueNumber} by @${sender} with OmniRoute auto/coding engine. Review will appear shortly.`
              });
              return;
            }
            }
