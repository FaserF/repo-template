name: Reusable Hermes Bot

on:
  workflow_call:
    inputs:
      omniroute_base_url:
        description: "OmniRoute Base URL (falls back to secret OMNIROUTE_BASE_URL if omitted)"
        type: string
        default: ""
      model:
        description: "OmniRoute Model (auto/coding or auto/smart)"
        type: string
        default: "auto/coding"
      runner:
        description: "Runner environment ('ubuntu-latest', 'self-hosted', or 'auto')"
        type: string
        default: "auto"

jobs:
  interactive-bot:
    name: Hermes Interactive Bot
    if: |
      github.actor != 'faserf-hermes-agent[bot]' &&
      !endsWith(github.actor, '[bot]') &&
      !startsWith(github.actor, 'app/') &&
      (github.event_name != 'issue_comment' || (github.event.comment.user.type != 'Bot' && !endsWith(github.event.comment.user.login, '[bot]') && !startsWith(github.event.comment.user.login, 'app/'))) &&
      (github.event.issue == null || (!contains(github.event.issue.title, 'Dependency Dashboard') && !contains(github.event.issue.title, 'Renovate') && !contains(github.event.issue.title, 'Dependabot') && github.event.issue.user.type != 'Bot' && !endsWith(github.event.issue.user.login, '[bot]')))
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || ((inputs.runner == 'self-hosted' || github.event.repository.private == true || vars.FORCE_SELF_HOSTED_RUNNER == 'true' || vars.USE_SELF_HOSTED_RUNNERS == 'true' || vars.USE_GITHUB_RUNNERS == 'false') && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest') }}
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Generate Bot Token
        id: app-token
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Process Interactive Command & Reactive Controls
        env:
          OMNIROUTE_BASE_URL: ${{ inputs.omniroute_base_url != '' && inputs.omniroute_base_url || secrets.OMNIROUTE_BASE_URL }}
          OMNIROUTE_MODEL: ${{ inputs.model }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const payload = context.payload;
            const sender = (payload.sender ? payload.sender.login : (payload.comment ? payload.comment.user.login : "")).toLowerCase();
            const senderType = payload.sender ? payload.sender.type : (payload.comment ? payload.comment.user.type : "");

            // STRICT ANTI-LOOP & BOT EXCLUSION FILTER:
            if (senderType === 'Bot' || sender.endsWith('[bot]') || sender.startsWith('app/') || context.actor.endsWith('[bot]')) {
              console.log(`Skipping bot actor: ${sender} (actor: ${context.actor})`);
              return;
            }

            const issueTitle = (payload.issue ? payload.issue.title : (payload.pull_request ? payload.pull_request.title : "")) || "";
            if (/dependency dashboard|renovate|dependabot/i.test(issueTitle)) {
              console.log(`Skipping dependency dashboard / automated bot issue: "${issueTitle}"`);
              return;
            }

            if (payload.issue && payload.issue.user && (payload.issue.user.type === 'Bot' || payload.issue.user.login.endsWith('[bot]') || payload.issue.user.login.startsWith('app/'))) {
              console.log(`Skipping issue opened by bot user: ${payload.issue.user.login}`);
              return;
            }

            // Only inspect comment body on comment events; never fall back to issue body
            let comment = "";
            if (payload.comment) {
              comment = payload.comment.body || "";
            } else if (context.eventName === 'issues' && payload.issue) {
              comment = payload.issue.body || "";
            }

            const isPR = Boolean(payload.issue && payload.issue.pull_request) || Boolean(payload.pull_request);
            const issueNumber = payload.issue ? payload.issue.number : (payload.pull_request ? payload.pull_request.number : 0);

            // Strip markdown blockquotes so quoted prior comments/bot responses never trigger actions
            const commandText = comment
              .split('\n')
              .filter(line => !line.trim().startsWith('>'))
              .join('\n');

            if (!issueNumber || !commandText.trim()) return;

            const isReviewCmd = /@faserf-hermes-agent\s+(?:review|recheck|deep)|\/(?:review|recheck|deep)|\[x\]\s*(?:🔄\s*)?Request re-review/i.test(commandText);
            const isResolveCmd = /@faserf-hermes-agent\s+(?:resolve|autofix|fix-ci|rebase|merge)|\/(?:resolve|autofix|fix-ci|rebase|merge)|\[x\]\s*(?:⚡\s*)?Auto-fix|\[x\]\s*(?:🛠️\s*)?Resolve with OpenHands/i.test(commandText);
            const isDocCmd = /@faserf-hermes-agent\s+(?:doc|docs|document)|\/(?:doc|docs|document)|\[x\]\s*(?:📚\s*)?Update docs/i.test(commandText);
            const isPauseCmd = /\[x\]\s*(?:⏸️\s*)?Pause automated reviews|@faserf-hermes-agent\s+pause/i.test(commandText);
            const isHelpCmd = /@faserf-hermes-agent\s+help|\/help/i.test(commandText);

            if (!isReviewCmd && !isResolveCmd && !isPauseCmd && !isHelpCmd && !isDocCmd) {
              return;
            }

            // 1. Dynamic RBAC: Determine caller permissions strictly per repository via .github/hermes-repo.yml and GitHub API
            const sender = (payload.sender ? payload.sender.login : (payload.comment ? payload.comment.user.login : "")).toLowerCase();
            const association = (payload.comment ? payload.comment.author_association : "") || "";
            const repoOwner = context.repo.owner.toLowerCase();

            let configuredAdmins = [];
            let allowCollaborators = true;
            try {
              const res = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: ".github/hermes-repo.yml"
              });
              const rawCfg = Buffer.from(res.data.content, "base64").toString("utf-8");
              const adminMatch = rawCfg.match(/admins:\s*\n((?:\s*-\s*[\w\-]+\s*\n)+)/);
              if (adminMatch) {
                configuredAdmins = adminMatch[1].split("\n").map(l => l.replace(/[-\s]/g, "").toLowerCase()).filter(Boolean);
              }
              if (/allow_collaborators:\s*false/i.test(rawCfg)) {
                allowCollaborators = false;
              }
            } catch (e) {
              // File not present or unreadable - dynamically relies on repository permissions
            }

            if (!configuredAdmins.includes(repoOwner)) {
              configuredAdmins.push(repoOwner);
            }

            const isExplicitAdmin = configuredAdmins.includes(sender);
            const isCollab = allowCollaborators && ["OWNER", "MEMBER", "COLLABORATOR"].includes(association);
            let hasWritePerm = false;
            if (!isExplicitAdmin && !isCollab && allowCollaborators) {
              try {
                const permRes = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: sender
                });
                const perm = permRes.data ? permRes.data.permission : "none";
                hasWritePerm = ["admin", "write"].includes(perm);
              } catch (e) {}
            }

            const canExecuteCritical = isExplicitAdmin || isCollab || hasWritePerm;

            if (isHelpCmd) {
              const adminListText = configuredAdmins.length > 0 ? configuredAdmins.map(a => '@' + a).join(', ') : 'repository maintainers';
              const helpBody = `> [!NOTE]\n` +
                `> 🤖 **FaserF Hermes Agent Bot Commands & Permissions**  \n` +
                `> Provided by [faserf-hermes-agent[bot]](https://github.com/apps/faserf-hermes-agent)  \n\n` +
                `**Public Commands (Anyone):**\n` +
                `* \`@faserf-hermes-agent review\` (aliases: \`recheck\`, \`deep\`, \`/review\`, \`/recheck\`) — Trigger re-review & Repowise health analysis.\n` +
                `* \`@faserf-hermes-agent doc\` (aliases: \`docs\`, \`document\`, \`/doc\`) — Sync and update documentation & README (GitDocify parity).\n` +
                `* PR title \`[skip hermes]\` / \`[skip review]\` — Skip automated review on this PR.\n` +
                `* \`@faserf-hermes-agent help\` — Display this command reference.\n\n` +
                `**Restricted Maintainer Actions (${adminListText}):**\n` +
                `* \`@faserf-hermes-agent autofix\` (or \`resolve\`, \`fix-ci\`, \`[x] ⚡ Auto-fix\`) — Autonomous SWE agent solver (OpenHands) to fix CI/action errors and push commits.\n` +
                `* \`@faserf-hermes-agent rebase\` (or \`merge\`) — Resolve merge conflicts against base branch automatically.\n` +
                `* \`[x] ⏸️ Pause automated reviews\` — Pause automated bot evaluations.\n` +
                `* *Configured per-repository via \`.github/hermes-repo.yml\`.*`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: helpBody
              });
              return;
            }

            if (isResolveCmd) {
              if (!canExecuteCritical) {
                const adminListText = configuredAdmins.length > 0 ? configuredAdmins.map(a => '@' + a).join(', ') : 'repository maintainers';
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `> [!WARNING]\n` +
                    `> 🔒 **Permission Denied**  \n` +
                    `> Automated code resolution (\`resolve\` / OpenHands) is restricted to configured maintainers (\`${adminListText}\`).  \n` +
                    `> Non-maintainers may still request reviews or ask maintainers to trigger auto-fixes.`
                });
                return;
              }

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ["openhands:ready"]
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `> 🤖 **OpenHands Dispatch:** Autonomous investigation scheduled for #${issueNumber} by @${sender}. OpenHands agent is spinning up.`
              });
              return;
            }

            if (isPauseCmd) {
              if (!canExecuteCritical) {
                const adminListText = configuredAdmins.length > 0 ? configuredAdmins.map(a => '@' + a).join(', ') : 'repository maintainers';
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `> [!WARNING]\n` +
                    `> 🔒 **Permission Denied**  \n` +
                    `> Pausing automated reviews is restricted to configured maintainers (\`${adminListText}\`).`
                });
                return;
              }

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ["ai-review-paused"]
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `> ⏸️ **Automated Reviews Paused:** Automated reviews on #${issueNumber} paused by @${sender}. Uncheck or run \`@faserf-hermes-agent review\` to resume.`
              });
              return;
            }

            if (isDocCmd) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ["openhands:ready"]
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `> 📚 **Hermes Documentation Engine (GitDocify Parity):** Documentation generation/sync scheduled for #${issueNumber} by @${sender}. Agent is inspecting codebase and updating README/docs.`
              });
              return;
            }

            if (isReviewCmd && isPR) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `> 🔍 **PR Review Triggered:** Re-evaluating pull request #${issueNumber} by @${sender} with OmniRoute auto/coding engine. Review will appear shortly.`
              });
              return;
            }
