name: Reusable CI Workflow

on:
  workflow_call:
    inputs:
      project_type:
        description: "Project type (ha-integration, ha-addon, go, python, generic)"
        type: string
        default: "generic"
      python_version:
        description: "Python version for test runners"
        type: string
        default: "3.15"
      runner:
        description: "Runner environment ('ubuntu-latest', 'self-hosted', or 'auto')"
        type: string
        default: "auto"

jobs:
  validate:
    name: Validate & Test
    if: github.event_name == 'pull_request' || !contains((github.event.head_commit.message || ''), '[skip-tests]')
    timeout-minutes: 15
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || ((inputs.runner == 'self-hosted' || github.event.repository.private == true || vars.FORCE_SELF_HOSTED_RUNNER == 'true' || vars.USE_SELF_HOSTED_RUNNERS == 'true' || vars.USE_GITHUB_RUNNERS == 'false') && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest') }}
    steps:
      - name: Runner Pre-Flight & Queue Load Gate
        if: runner.os == 'Linux' && (runner.environment == 'self-hosted' || github.event.repository.private == true)
        run: |
          if [ -f /proc/loadavg ]; then
            LOAD_1M=$(awk '{print $1}' /proc/loadavg)
            echo "Current node 1m load: $LOAD_1M"
            WAIT_SECONDS=0
            while [ "$(awk 'BEGIN {print ('"$LOAD_1M"' > 6.5)}')" -eq 1 ] && [ "$WAIT_SECONDS" -lt 120 ]; do
              echo "Host load is high ($LOAD_1M). Queuing for capacity (waited ${WAIT_SECONDS}s)..."
              sleep 10
              WAIT_SECONDS=$((WAIT_SECONDS + 10))
              LOAD_1M=$(awk '{print $1}' /proc/loadavg)
            done
            echo "Node load acceptable ($LOAD_1M). Proceeding with execution."
          fi

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Private Data & Credential Diff Guard
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          GUARD="scripts/check_private_data.py"
          if [ ! -f "$GUARD" ]; then
            curl -fsSL https://raw.githubusercontent.com/FaserF/repo-template/main/scripts/check_private_data.py -o /tmp/check_private_data.py || exit 0
            GUARD="/tmp/check_private_data.py"
          fi
          python3 "$GUARD" --self-test --github-event-name "$EVENT_NAME" --github-before "$BEFORE_SHA" --default-branch "$DEFAULT_BRANCH"

      - name: Detect Project Architecture & Test Suites
        id: detect
        run: |
          TYPE="${{ inputs.project_type }}"
          IS_HA="false"
          IS_ADDON="false"
          IS_PYTHON="false"
          IS_GO="false"
          IS_NODE="false"
          IS_DOTNET="false"
          IS_DOCKER="false"

          if [ -d "custom_components" ] || [ "$TYPE" = "ha-integration" ]; then
            IS_HA="true"
            IS_PYTHON="true"
          fi
          if [ -f "build.yaml" ] || [ -f "config.yaml" ] && [ -d "addon" ] || [ "$TYPE" = "ha-addon" ]; then
            IS_ADDON="true"
          fi
          if [ -f "pyproject.toml" ] || [ -f "setup.py" ] || [ -f "requirements.txt" ] || [ -f "requirements_test.txt" ] || ls ./*.py >/dev/null 2>&1 || [ "$TYPE" = "python" ]; then
            IS_PYTHON="true"
          fi
          if [ -f "go.mod" ] || [ "$TYPE" = "go" ]; then
            IS_GO="true"
          fi
          if [ -f "package.json" ] || [ "$TYPE" = "node" ]; then
            IS_NODE="true"
          fi
          if ls ./*.sln >/dev/null 2>&1 || ls ./*/*.csproj >/dev/null 2>&1 || ls ./*.csproj >/dev/null 2>&1 || [ "$TYPE" = "dotnet" ]; then
            IS_DOTNET="true"
          fi
          if [ -f "Dockerfile" ] || [ -f "compose.yaml" ] || [ -f "docker-compose.yml" ]; then
            IS_DOCKER="true"
          fi

          {
            echo "is_ha=$IS_HA"
            echo "is_addon=$IS_ADDON"
            echo "is_python=$IS_PYTHON"
            echo "is_go=$IS_GO"
            echo "is_node=$IS_NODE"
            echo "is_dotnet=$IS_DOTNET"
            echo "is_docker=$IS_DOCKER"
          } >> "$GITHUB_OUTPUT"
          echo "Summary: HA=$IS_HA, Addon=$IS_ADDON, Python=$IS_PYTHON, Go=$IS_GO, Node=$IS_NODE, Dotnet=$IS_DOTNET, Docker=$IS_DOCKER"

      # --- Home Assistant Integration Tests ---
      - name: Normalize Manifest Keys Order
        if: steps.detect.outputs.is_ha == 'true'
        run: |
          python3 -c "
          import json, glob
          for p in glob.glob('custom_components/*/manifest.json'):
              with open(p, 'r', encoding='utf-8') as f:
                  d = json.load(f)
              ordered = {}
              if 'domain' in d: ordered['domain'] = d.pop('domain')
              if 'name' in d: ordered['name'] = d.pop('name')
              for k in sorted(d.keys()):
                  ordered[k] = d[k]
              with open(p, 'w', encoding='utf-8') as f:
                  json.dump(ordered, f, indent=2)
                  f.write('\n')
          "

      - name: Validate JSON & YAML Syntax
        if: steps.detect.outputs.is_ha == 'true' || steps.detect.outputs.is_python == 'true'
        run: |
          python3 -c "
          import glob, json, sys
          try:
              import yaml
          except ImportError:
              yaml = None
          for f in glob.glob('**/*.json', recursive=True):
              if '.venv' in f or 'node_modules' in f:
                  continue
              raw = open(f, 'rb').read()
              enc = 'utf-16' if raw.startswith((b'\xff\xfe', b'\xfe\xff')) else 'utf-8-sig'
              json.loads(raw.decode(enc))
          if yaml is not None:
              yaml.add_multi_constructor('tag:yaml.org,2002:python/name:', lambda l, s, n: None, Loader=yaml.SafeLoader)
              yaml.add_multi_constructor('!', lambda l, s, n: None, Loader=yaml.SafeLoader)
              for f in glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True):
                  if '.venv' in f or 'node_modules' in f:
                      continue
                  with open(f, encoding='utf-8-sig') as fh:
                      yaml.safe_load(fh)
          "

      - name: Hassfest Validation
        if: steps.detect.outputs.is_ha == 'true'
        uses: home-assistant/actions/hassfest@master

      - name: HACS Action Validation
        if: steps.detect.outputs.is_ha == 'true' && github.event.repository.private != true
        uses: hacs/action@main
        with:
          category: integration

      # --- Python Setup & Pytest ---
      - name: Setup Python
        if: steps.detect.outputs.is_python == 'true'
        uses: actions/setup-python@v7
        continue-on-error: true
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Python Dependencies (uv-accelerated)
        if: steps.detect.outputs.is_python == 'true'
        run: |
          python -m pip install uv || true
          if command -v uv >/dev/null 2>&1; then
            INSTALLER="uv pip install --system"
          else
            INSTALLER="python -m pip install"
          fi
          if [ -f requirements_test.txt ]; then
            $INSTALLER -r requirements_test.txt
          elif [ -f requirements.txt ]; then
            $INSTALLER -r requirements.txt
          fi
          $INSTALLER pytest pytest-asyncio pytest-timeout ruff
          if [ "${{ steps.detect.outputs.is_ha }}" = "true" ]; then
            $INSTALLER pytest-homeassistant-custom-component
          fi

      - name: Run Mypy Type Check
        if: steps.detect.outputs.is_python == 'true'
        run: |
          if [ -f mypy.ini ] || ([ -f pyproject.toml ] && grep -q '\[tool\.mypy\]' pyproject.toml); then
            if ! command -v mypy >/dev/null 2>&1; then
              if command -v uv >/dev/null 2>&1; then
                uv pip install --system mypy
              else
                python -m pip install mypy
              fi
            fi
            if [ "${{ steps.detect.outputs.is_ha }}" = "true" ] && [ -d custom_components ]; then
              mypy custom_components
            else
              mypy .
            fi
          fi

      - name: Check Quality Scale
        if: steps.detect.outputs.is_ha == 'true'
        run: |
          if [ -f script/check_quality_scale.py ]; then
            if command -v uv >/dev/null 2>&1; then
              uv pip install --system packaging pyyaml
            else
              python -m pip install packaging pyyaml
            fi
            python script/check_quality_scale.py
          fi

      - name: Run Pytest Test Suite
        if: steps.detect.outputs.is_python == 'true' && hashFiles('tests/**') != ''
        run: |
          PYTHONPATH=. python -m pytest tests/ -v --timeout=60

      # --- Go Setup & Tests ---
      - name: Setup Go
        if: steps.detect.outputs.is_go == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Run Go Tests
        if: steps.detect.outputs.is_go == 'true'
        run: |
          go test -v -race ./...

      # --- Node.js Setup & Tests ---
      - name: Setup Node.js
        if: steps.detect.outputs.is_node == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Run Node Tests
        if: steps.detect.outputs.is_node == 'true'
        run: |
          npm ci || npm install
          npm test --if-present

      # --- .NET Setup & Tests ---
      - name: Setup .NET
        if: steps.detect.outputs.is_dotnet == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run .NET Build & Tests
        if: steps.detect.outputs.is_dotnet == 'true'
        run: |
          dotnet restore
          dotnet build -c Release --no-restore
          dotnet test -c Release --no-build

  auto-merge:
    name: Auto Merge Dependency Updates
    timeout-minutes: 5
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || ((inputs.runner == 'self-hosted' || github.event.repository.private == true || vars.FORCE_SELF_HOSTED_RUNNER == 'true' || vars.USE_SELF_HOSTED_RUNNERS == 'true' || vars.USE_GITHUB_RUNNERS == 'false') && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest') }}
    needs: [validate]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      github.event_name == 'pull_request' &&
      (
        github.actor == 'renovate[bot]' ||
        github.actor == 'dependabot[bot]' ||
        startsWith(github.head_ref, 'renovate/') ||
        startsWith(github.head_ref, 'dependabot/')
      )
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate Bot Token
        id: app-token
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Auto-Merge Dependency Pull Request
        run: |
          PR_URL="${{ github.event.pull_request.html_url }}"
          echo "Merging validated dependency PR: $PR_URL"
          TOKEN="${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}"
          GH_TOKEN="$TOKEN" gh pr merge --squash --auto "$PR_URL" || GH_TOKEN="$TOKEN" gh pr merge --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

