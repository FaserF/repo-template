name: Reusable PR Reviewer

on:
  workflow_call:
    inputs:
      model:
        description: "OmniRoute Model (auto/coding or auto/smart)"
        type: string
        default: "auto/coding"
      omniroute_base_url:
        description: "OmniRoute Base URL (falls back to secret OMNIROUTE_BASE_URL if omitted)"
        type: string
        default: ""
      runner:
        description: "Runner environment ('ubuntu-latest', 'self-hosted', or 'auto')"
        type: string
        default: "auto"
      auto_commit_safe_fixes:
        description: "Automatically commit simple, verified non-breaking fixes on writable PR branches"
        type: boolean
        default: true

jobs:
  review:
    name: Hermes PR Reviewer
    timeout-minutes: 20
    if: |
      github.actor != 'faserf-hermes-agent[bot]' &&
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.title, '[skip hermes]') &&
      !contains(github.event.pull_request.title, '[skip review]') &&
      !contains(github.event.pull_request.title, '[skip ci]') &&
      (
        github.event.action != 'review_requested' ||
        contains(github.event.requested_reviewer.login, 'hermes') ||
        contains(github.event.requested_reviewer.login, 'faserf')
      ) &&
      (
        github.event.action == 'review_requested' ||
        (
          github.event.pull_request.user.login != 'renovate[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          !startsWith(github.event.pull_request.head.ref, 'renovate/') &&
          !startsWith(github.event.pull_request.head.ref, 'dependabot/')
        )
      )
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || ((inputs.runner == 'self-hosted' || github.event.repository.private == true || vars.FORCE_SELF_HOSTED_RUNNER == 'true' || vars.USE_SELF_HOSTED_RUNNERS == 'true' || vars.USE_GITHUB_RUNNERS == 'false') && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest') }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Generate Bot Token
        id: app-token
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout PR Branch for Verification & Safe Auto-Fix
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Request Hermes Bot as Reviewer
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        uses: actions/github-script@v9
        continue-on-error: true
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                reviewers: ['faserf-hermes-agent']
              });
            } catch (e) {
              console.log('Bot review request notice:', e.message);
            }

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Prepare Review Engine Script
        run: |
          cat << 'EOF' > /tmp/run_pr_review.py
          import json, os, py_compile, re, shutil, subprocess, sys, time, urllib.error, urllib.request
          from pathlib import Path

          pr_num = int(os.environ.get("PR_NUMBER", "0"))
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("BOT_TOKEN") or os.environ.get("GITHUB_TOKEN", "")
          omniroute_url = (os.environ.get("OMNIROUTE_BASE_URL") or "https://api.openai.com/v1").rstrip("/")
          omniroute_key = os.environ.get("OMNIROUTE_API_KEY", "")
          model = os.environ.get("MODEL", "auto/coding")
          can_autocommit = (
              os.environ.get("ALLOW_AUTOCOMMIT", "true").lower() == "true"
              and os.environ.get("SAME_REPO_PR", "false").lower() == "true"
              and Path(".git").is_dir()
          )

          if not token or not repo or pr_num <= 0:
              print("Missing review parameters. Exiting.")
              sys.exit(0)

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github.v3+json",
              "User-Agent": "FaserF-Hermes-Reviewer",
          }
          owner, name = repo.split("/")
          start_time = time.time()
          marker = "<!-- hermes-ai-reviewer-status -->"

          def gh_json(url: str, data: dict | None = None, method: str = "GET"):
              req = urllib.request.Request(
                  url,
                  headers=headers,
                  data=json.dumps(data).encode() if data is not None else None,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return json.loads(resp.read().decode())

          def is_dependency_pr(pr_data: dict, files: list[str]) -> bool:
              author = ((pr_data.get("user") or {}).get("login") or "").lower()
              head_ref = ((pr_data.get("head") or {}).get("ref") or "").lower()
              title = (pr_data.get("title") or "").lower()
              if author in ("renovate[bot]", "dependabot[bot]") or head_ref.startswith(("renovate/", "dependabot/")):
                  return True
              if title.startswith(("chore(deps)", "build(deps)")) or "configure renovate" in title:
                  return True
              dep_only = {
                  "package.json", "package-lock.json", "yarn.lock", "pnpm-lock.yaml",
                  "uv.lock", "poetry.lock", "cargo.lock", "go.mod", "go.sum",
                  "requirements.txt", "requirements_test.txt", ".github/renovate.json", "renovate.json",
              }
              return bool(files) and all(Path(f).name in dep_only or f in dep_only for f in files)

          def classify_pr(files: list[str], diff_lines: int) -> tuple[str, int, str]:
              doc_exts = {".md", ".txt", ".rst", ".png", ".jpg", ".svg", ".ico"}
              doc_names = {"LICENSE", ".gitignore", "strings.json", "icons.json", "hacs.json"}
              if files and all(
                  Path(f).suffix.lower() in doc_exts
                  or Path(f).name in doc_names
                  or "/translations/" in f
                  or "/brand/" in f
                  for f in files
              ):
                  return "fast-docs", 12000, "auto/coding"
              if diff_lines <= 160 and len(files) <= 4:
                  return "fast-small", 16000, model
              return "deep-code", 40000, model

          # 1. Fetch PR details & check skip/dedup
          pr_data = gh_json(f"https://api.github.com/repos/{repo}/pulls/{pr_num}")
          commit_sha = (pr_data.get("head") or {}).get("sha", "")
          head_ref = (pr_data.get("head") or {}).get("ref", "")
          pr_title = pr_data.get("title", "")

          if any(m in pr_title.lower() for m in ("[skip hermes]", "[skip review]", "[skip ci]")):
              print(f"Skipping review due to title marker: {pr_title}")
              sys.exit(0)

          try:
              for r in gh_json(f"https://api.github.com/repos/{repo}/pulls/{pr_num}/reviews"):
                  login = ((r.get("user") or {}).get("login") or "").lower()
                  if r.get("commit_id") == commit_sha and "faserf-hermes-agent" in login:
                      print(f"Commit {commit_sha[:8]} already reviewed by {login}. Skipping duplicate run.")
                      sys.exit(0)
          except Exception as exc:
              print(f"Review dedup note: {exc}")

          # 2. Fetch PR diff
          diff_headers = {**headers, "Accept": "application/vnd.github.v3.diff"}
          try:
              with urllib.request.urlopen(urllib.request.Request(f"https://api.github.com/repos/{repo}/pulls/{pr_num}", headers=diff_headers), timeout=20) as d_resp:
                  diff_text = d_resp.read().decode(errors="replace")
          except Exception:
              diff_text = ""

          if not diff_text.strip():
              print("Empty diff. Exiting cleanly.")
              sys.exit(0)

          changed_files = []
          diff_line_count = 0
          for ln in diff_text.splitlines():
              if ln.startswith("+++ b/"):
                  changed_files.append(ln[6:].strip())
              elif (ln.startswith("+") and not ln.startswith("+++")) or (ln.startswith("-") and not ln.startswith("---")):
                  diff_line_count += 1

          # 3. Deterministic secret scan (always runs, 0 LLM tokens)
          secret_rules = [
              ("GitHub Token", r"gh[pousr]_[A-Za-z0-9_]{36,}"),
              ("AWS Access Key", r"AKIA[0-9A-Z]{16}"),
              ("Private Key", r"-----BEGIN (?:RSA|OPENSSH|EC|DSA|PGP|PRIVATE) KEY-----"),
              ("Slack Token", r"xox[baprs]-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24,32}"),
              ("Telegram Bot Token", r"[0-9]{8,10}:[a-zA-Z0-9_-]{35}"),
              ("Tailscale Key", r"tskey-(?:auth|client)-[a-zA-Z0-9]+"),
              ("Infisical Token", r"st\.[a-f0-9]{24,}\.[a-zA-Z0-9]{32,}"),
              ("Hardcoded Credential", r"(?i)(?:api[_-]?key|secret|password|auth[_-]?token|access[_-]?token)\s*[:=]\s*['\"][A-Za-z0-9_\-.~!@#$%^&*+=]{14,}['\"]"),
          ]
          secret_findings = []
          curr_file, curr_line = None, 0
          for d_line in diff_text.splitlines():
              if d_line.startswith("+++ b/"):
                  curr_file = d_line[6:].strip()
              elif d_line.startswith("@@"):
                  m = re.search(r"\+(\d+)", d_line)
                  if m:
                      curr_line = int(m.group(1)) - 1
              elif d_line.startswith("+") and not d_line.startswith("+++"):
                  curr_line += 1
                  added = d_line[1:]
                  if any(d in added.lower() for d in ("mock_", "fake_", "dummy_", "test_", "example", "placeholder", "xxx")):
                      continue
                  for s_name, s_pat in secret_rules:
                      if re.search(s_pat, added):
                          secret_findings.append({
                              "path": curr_file or "unknown",
                              "line": curr_line,
                              "severity": "Critical",
                              "title": f"Security Alert: Leaked {s_name}",
                              "body": f"> [!CAUTION]\n> Hardcoded `{s_name}` found in added lines. Rotate immediately and store in `.env` / Infisical.",
                              "safe_autofix": False,
                              "suggested_diff": "",
                              "agent_prompt": f"Remove hardcoded {s_name} from {curr_file} and load from environment variables.",
                          })
              elif not d_line.startswith("-"):
                  curr_line += 1

          # Skip LLM review, codebase health, and doc/wiki checks cleanly on dependency PRs
          if is_dependency_pr(pr_data, changed_files) and not secret_findings:
              print("Dependency update PR detected cleanly with 0 secret issues; skipping redundant AI/doc/health analysis.")
              sys.exit(0)

          if not omniroute_key and not secret_findings:
              if os.environ.get("IS_FORK", "false").lower() == "true":
                  print("No OMNIROUTE_API_KEY available on external fork PR. Exiting cleanly.")
              else:
                  print("::warning::OMNIROUTE_OPENHANDS_API_KEY / OMNIROUTE_API_KEY is missing in repository secrets; skipping AI PR review.")
              sys.exit(0)
          if omniroute_key and not os.environ.get("OMNIROUTE_BASE_URL"):
              print("::warning::OMNIROUTE_BASE_URL is not set in repository secrets.")

          # Update status comment
          status_cid = None
          review_mode, max_diff_len, routed_model = classify_pr(changed_files, diff_line_count)
          try:
              for sc in gh_json(f"https://api.github.com/repos/{repo}/issues/{pr_num}/comments"):
                  if marker in (sc.get("body") or ""):
                      status_cid = sc.get("id")
                      break
              in_prog = f"{marker}\n> 🔄 **FaserF Hermes Agent Reviewer:** Analysis in progress...  \n> **Engine:** OmniRoute (`{routed_model}` · `{review_mode}`) · Hermes Fleet Code Intelligence"
              if status_cid:
                  gh_json(f"https://api.github.com/repos/{repo}/issues/comments/{status_cid}", {"body": in_prog}, method="PATCH")
              else:
                  status_cid = gh_json(f"https://api.github.com/repos/{repo}/issues/{pr_num}/comments", {"body": in_prog}, method="POST").get("id")
          except Exception as exc:
              print(f"Status note: {exc}")

          # 4. Deterministic safe auto-fixes on touched files (only before AI review if writable)
          autocommitted_notes = []
          py_touched = [f for f in changed_files if f.endswith(".py") and Path(f).is_file()]
          if can_autocommit and py_touched:
              if shutil.which("ruff") is None:
                  subprocess.run(["python", "-m", "pip", "install", "--quiet", "ruff"], check=False)
              if shutil.which("ruff"):
                  subprocess.run(["ruff", "check", "--select", "F401,I001,W291,W292,W293", "--fix", *py_touched], check=False)
                  for pf in py_touched:
                      try:
                          py_compile.compile(pf, doraise=True)
                      except py_compile.PyCompileError:
                          subprocess.run(["git", "checkout", "--", pf], check=False)
                  det_diff = subprocess.run(["git", "diff", "--name-only"], capture_output=True, text=True).stdout.splitlines()
                  if det_diff:
                      autocommitted_notes.append(f"Auto-cleaned imports/whitespace in `{', '.join(det_diff)}`")

          # 5. Adaptive OmniRoute Review
          is_diff_truncated = len(diff_text) > max_diff_len
          analyzed_diff = diff_text[:max_diff_len]
          docs_mode_hint = (
              "This PR only modifies docs/translations/assets. Focus strictly on typos, broken markdown/JSON, or schema errors. Do NOT ask for unit tests."
              if review_mode == "fast-docs"
              else "For trivial, guaranteed non-breaking fixes (<= 5 lines, e.g. missing return annotation, simple typo, unused variable), set \"safe_autofix\": true with exact unique \"old_snippet\" and \"new_snippet\" so the bot can commit them safely."
          )

          review_prompt = f"""You are FaserF Hermes Agent Reviewer for @FaserF repositories.
          Profile: {review_mode} ({len(changed_files)} files, {diff_line_count} changed lines). {docs_mode_hint}
          Analyze this PR diff and return strictly valid JSON (no markdown fences):
          {{
            "event": "APPROVE" | "REQUEST_CHANGES" | "COMMENT",
            "short_summary": "1-2 sentence overview of changes.",
            "health_score": {{"before": 9.20, "after": 9.20, "delta": 0.0, "rating": "Healthy"}},
            "test_estimate": "Brief assessment of test coverage or 'N/A (docs/config)'.",
            "hygiene_notes": [],
            "walkthrough_table": [{{"file": "path/file.ext", "summary": "concise change summary"}}],
            "findings": [
              {{
                "path": "path/to/file.ext",
                "line": 10,
                "severity": "Major" | "Minor" | "Suggestion",
                "title": "Short title",
                "body": "Explanation of issue.",
                "safe_autofix": false,
                "old_snippet": "",
                "new_snippet": "",
                "suggested_diff": "```diff\\n- old\\n+ new\\n```",
                "agent_prompt": "Imperative fix instruction."
              }}
            ]
          }}

          Diff:
          ```diff
          {analyzed_diff}
          ```"""

          parsed = {"event": "COMMENT", "short_summary": "Automated review complete.", "findings": []}
          if omniroute_key and not secret_findings:
              try:
                  llm_req = urllib.request.Request(
                      f"{omniroute_url}/chat/completions",
                      headers={"Authorization": f"Bearer {omniroute_key}", "Content-Type": "application/json"},
                      data=json.dumps({
                          "model": routed_model,
                          "messages": [{"role": "user", "content": review_prompt}],
                          "temperature": 0.1,
                      }).encode(),
                  )
                  with urllib.request.urlopen(llm_req, timeout=180) as resp:
                      raw_out = json.loads(resp.read().decode())["choices"][0]["message"]["content"].strip()
                  if raw_out.startswith("```"):
                      lines = raw_out.splitlines()
                      raw_out = "\n".join(lines[1:-1] if lines[-1].startswith("```") else lines[1:]).strip()
                  parsed = json.loads(raw_out)
              except Exception as exc:
                  print(f"OmniRoute review generation skipped: {exc}")
                  parsed = {"event": "COMMENT", "short_summary": f"Automated hygiene check note: {exc}", "findings": []}

          # 6. Apply safe, verified LLM micro-fixes on writable branches
          remaining_findings = list(secret_findings)
          for f in parsed.get("findings", []):
              applied = False
              fpath = f.get("path", "")
              old_s = f.get("old_snippet", "")
              new_s = f.get("new_snippet", "")
              if (
                  can_autocommit
                  and not secret_findings
                  and f.get("safe_autofix") is True
                  and f.get("severity") in ("Minor", "Suggestion", "Nitpick")
                  and fpath in changed_files
                  and old_s
                  and new_s != old_s
                  and len(old_s.splitlines()) <= 5
                  and len(new_s.splitlines()) <= 5
                  and Path(fpath).is_file()
              ):
                  original = Path(fpath).read_text(encoding="utf-8")
                  if original.count(old_s) == 1:
                      updated = original.replace(old_s, new_s, 1)
                      Path(fpath).write_text(updated, encoding="utf-8")
                      valid = True
                      try:
                          if fpath.endswith(".py"):
                              py_compile.compile(fpath, doraise=True)
                          elif fpath.endswith(".json"):
                              json.loads(updated)
                      except Exception:
                          valid = False
                      if valid:
                          applied = True
                          autocommitted_notes.append(f"`{fpath}:{f.get('line', 1)}` — {f.get('title')}")
                      else:
                          Path(fpath).write_text(original, encoding="utf-8")
              if not applied:
                  remaining_findings.append(f)

          if can_autocommit:
              git_dirty = subprocess.run(["git", "status", "--porcelain"], capture_output=True, text=True).stdout.strip()
              if git_dirty and head_ref:
                  subprocess.run(["git", "config", "user.name", "faserf-hermes-agent[bot]"], check=False)
                  subprocess.run(["git", "config", "user.email", "342667397+faserf-hermes-agent[bot]@users.noreply.github.com"], check=False)
                  subprocess.run(["git", "add", *changed_files], check=False)
                  staged = subprocess.run(["git", "diff", "--cached", "--name-only"], capture_output=True, text=True).stdout.strip()
                  if staged:
                      subprocess.run(["git", "commit", "-m", "chore(review): apply safe non-breaking review fixes"], check=True)
                      push_res = subprocess.run(["git", "push", "origin", f"HEAD:{head_ref}"], capture_output=True, text=True)
                      if push_res.returncode == 0:
                          commit_sha = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True, text=True).stdout.strip()
                          print(f"Auto-committed {len(autocommitted_notes)} safe fix(es) to {head_ref}.")
                      else:
                          print(f"Auto-commit push skipped: {push_res.stderr}")
                          autocommitted_notes.clear()

          findings = remaining_findings
          if secret_findings:
              event = "REQUEST_CHANGES"
          elif any(f.get("severity") in ("Critical", "Major") for f in findings):
              event = "REQUEST_CHANGES"
          else:
              event = parsed.get("event", "APPROVE" if not findings else "COMMENT")
              if not findings and event == "REQUEST_CHANGES":
                  event = "APPROVE"

          # 7. Auto-resolve addressed review threads
          active_keys = {(f.get("path"), f.get("line")) for f in findings}
          query_threads = """query($owner: String!, $name: String!, $pr: Int!) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $pr) {
                reviewThreads(first: 50) {
                  nodes { id isResolved path line comments(first: 1) { nodes { author { login } } } }
                }
              }
            }
          }"""
          try:
              g_data = gh_json("https://api.github.com/graphql", {"query": query_threads, "variables": {"owner": owner, "name": name, "pr": pr_num}}, method="POST")
              threads = g_data.get("data", {}).get("repository", {}).get("pullRequest", {}).get("reviewThreads", {}).get("nodes", [])
              mutation_resolve = """mutation($threadId: ID!) { resolveReviewThread(input: { threadId: $threadId }) { thread { id isResolved } } }"""
              for t in threads:
                  if not t.get("isResolved"):
                      author = ((t.get("comments", {}).get("nodes") or [{}])[0].get("author") or {}).get("login", "")
                      if ("faserf-hermes-agent" in author or "hermes" in author) and (t.get("path"), t.get("line")) not in active_keys and t.get("id"):
                          gh_json("https://api.github.com/graphql", {"query": mutation_resolve, "variables": {"threadId": t["id"]}}, method="POST")
          except Exception as exc:
              print(f"Thread resolution note: {exc}")

          # 8. Build clean review body (no competitor names)
          health = parsed.get("health_score", {})
          h_before = float(health.get("before", 9.15))
          h_after = float(health.get("after", round(max(5.0, h_before - 0.02 * len(findings)), 2)))
          delta = float(health.get("delta", round(h_after - h_before, 2)))
          rating = health.get("rating") or ("Healthy" if h_after >= 8.5 else "Moderate" if h_after >= 7.0 else "Needs Attention")
          rating_icon = "🟢" if h_after >= 8.5 else "🟡" if h_after >= 7.0 else "🔴"
          test_est = parsed.get("test_estimate") or f"{len(changed_files)} file(s) touched."

          body_lines = [
              f"<!-- hermes-ai-review:v4 " + json.dumps({"commit": commit_sha[:8], "mode": review_mode, "health": h_after, "autofixes": len(autocommitted_notes)}) + " -->",
              "> [!NOTE]",
              "> 🤖 **Automated Code Review by Hermes Fleet AI**  ",
              "> **Reviewer:** [faserf-hermes-agent[bot]](https://github.com/apps/faserf-hermes-agent) on behalf of @FaserF  ",
              f"> **Engine:** OmniRoute (`{routed_model}` · `{review_mode}`) · Adaptive Code Intelligence  ",
              "> *Maintainers make the final merge decision.*\n",
          ]
          if secret_findings:
              body_lines.append(f"> [!CAUTION]\n> 🚨 **SECURITY ALERT:** {len(secret_findings)} exposed credential(s) detected in this PR diff! Approval blocked until rotated and purged.\n")
          if autocommitted_notes:
              body_lines.append("### 🛠️ Auto-Committed Safe Fixes")
              for note in autocommitted_notes:
                  body_lines.append(f"- {note}")
              body_lines.append("")
          if review_mode != "fast-docs":
              body_lines.extend([
                  "### 📊 Codebase Health & Test Coverage",
                  f"**Health of changed files: `{h_before:.2f} → {h_after:.2f} ({delta:+.2f})`** · Rating: {rating_icon} **{rating}**  ",
                  f"* **Tests (estimate):** {test_est}",
              ])
              if parsed.get("hygiene_notes"):
                  body_lines.append(f"* **Worth a look:** {'; '.join(parsed['hygiene_notes'][:4])}")
              body_lines.append("")
          if is_diff_truncated:
              body_lines.append(f"> ⚠️ **Large Diff Truncated:** Changes exceeded {max_diff_len} bytes ({len(diff_text)} bytes total).\n")

          body_lines.append("## Findings")
          if findings:
              for f in findings:
                  body_lines.append(f"- **`{f.get('path')}:{f.get('line')}`**: **{f.get('title')}** ({f.get('severity', 'Minor')})")
              body_lines.append("")
          else:
              body_lines.append("✅ **No remaining defects detected.**\n")

          if review_mode == "deep-code" and parsed.get("walkthrough_table"):
              body_lines.append("<details><summary><strong>Walkthrough</strong></summary><dl><dd>\n")
              body_lines.append(parsed.get("short_summary", "") + "\n\n| File | Summary |\n|:---|:---|")
              for w in parsed.get("walkthrough_table", [])[:15]:
                  body_lines.append(f"| `{w.get('file')}` | {w.get('summary')} |")
              body_lines.append("\n</dd></dl></details>\n")
          elif parsed.get("short_summary"):
              body_lines.append(f"**Summary:** {parsed['short_summary']}\n")

          if findings:
              task_items = [
                  f"{i}. `{f.get('path')}:{f.get('line')}` — {f.get('title')}: {f.get('agent_prompt') or f.get('body', '')}"
                  for i, f in enumerate(findings, 1)
              ]
              body_lines.extend([
                  "<details><summary>🤖 <strong>Prompt for AI Agent (Fix Remaining Findings)</strong></summary><dl><dd>\n",
                  "```markdown\n" + "\n".join(task_items) + "\n```\n</dd></dl></details>\n",
              ])

          body_lines.extend([
              "### ⚡ Quick Actions",
              "- [ ] 🔄 Re-run review (`@faserf-hermes-agent review`) · 📚 Update docs (`@faserf-hermes-agent doc`) · ⚡ Auto-fix (`@faserf-hermes-agent resolve`)",
              "---\n**Decision:** `" + event + "` | **Reviewer:** faserf-hermes-agent[bot]",
          ])
          top_body = "\n".join(body_lines)

          # 9. Inline comments & submit
          inline_comments = []
          for f in findings:
              p, l = f.get("path"), int(f.get("line") or 1)
              c_lines = ["<!-- hermes-ai-generated:v2 -->\n", f"**{f.get('severity', 'Minor')}** · **{f.get('title')}**\n", f.get("body", "").strip()]
              diff = f.get("suggested_diff", "").strip()
              if diff:
                  clean = [ln[1:] if ln.startswith("+") else ln for ln in diff.splitlines() if not ln.startswith("```") and not ln.startswith("-")]
                  sugg = "\n".join(clean).strip()
                  if sugg:
                      c_lines.append(f"\n```suggestion\n{sugg}\n```")
              inline_comments.append({"path": p, "line": l, "side": "RIGHT", "body": "\n".join(c_lines)})

          review_payload = {"commit_id": commit_sha, "body": top_body, "event": event}
          if inline_comments:
              review_payload["comments"] = inline_comments

          try:
              gh_json(f"https://api.github.com/repos/{repo}/pulls/{pr_num}/reviews", review_payload, method="POST")
          except urllib.error.HTTPError as he:
              print(f"Batch review fallback: {he.code}")
              gh_json(f"https://api.github.com/repos/{repo}/pulls/{pr_num}/reviews", {"commit_id": commit_sha, "body": top_body, "event": event}, method="POST")

          elapsed = int(time.time() - start_time)
          done_body = (
              f"{marker}\n> ✅ **FaserF Hermes Agent Reviewer:** Completed in `{elapsed}s` (`{review_mode}`).  \n"
              f"> **Verdict:** `{event}` ({len(findings)} findings, {len(autocommitted_notes)} auto-committed fixes)"
          )
          try:
              if status_cid:
                  gh_json(f"https://api.github.com/repos/{repo}/issues/comments/{status_cid}", {"body": done_body}, method="PATCH")
          except Exception as exc:
              print(f"Status finish note: {exc}")
          EOF

      - name: Execute PR Review
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
          BOT_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_OPENHANDS_API_KEY || secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_BASE_URL: ${{ inputs.omniroute_base_url != '' && inputs.omniroute_base_url || secrets.OMNIROUTE_BASE_URL }}
          MODEL: ${{ inputs.model }}
          ALLOW_AUTOCOMMIT: ${{ inputs.auto_commit_safe_fixes }}
          SAME_REPO_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          python /tmp/run_pr_review.py || true
