name: Reusable PR Reviewer

on:
  workflow_call:
    inputs:
      model:
        description: "OmniRoute Model (auto/coding or auto/smart)"
        type: string
        default: "auto/coding"
      omniroute_base_url:
        description: "OmniRoute Base URL (falls back to secret OMNIROUTE_BASE_URL if omitted)"
        type: string
        default: ""
      runner:
        description: "Runner environment ('ubuntu-latest', 'self-hosted', or 'auto')"
        type: string
        default: "auto"

jobs:
  review:
    name: Hermes PR Reviewer
    timeout-minutes: 20
    if: |
      github.event_name != 'pull_request' ||
      github.event.action != 'review_requested' ||
      contains(github.event.requested_reviewer.login, 'hermes') ||
      contains(github.event.requested_reviewer.login, 'faserf')
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || ((inputs.runner == 'self-hosted' || github.event.repository.private == true || vars.FORCE_SELF_HOSTED_RUNNER == 'true' || vars.USE_SELF_HOSTED_RUNNERS == 'true' || vars.USE_GITHUB_RUNNERS == 'false') && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest') }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Generate Bot Token
        id: app-token
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Request Hermes Bot as Reviewer
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        uses: actions/github-script@v9
        continue-on-error: true
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                reviewers: ['faserf-hermes-agent']
              });
            } catch (e) {
              console.log('Bot review request notice:', e.message);
            }

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Prepare Review Engine Script
        run: |
          cat << 'EOF' > run_pr_review.py
          import json, os, re, sys, time, urllib.request, urllib.error

          pr_num = int(os.environ.get("PR_NUMBER", "0"))
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("BOT_TOKEN") or os.environ.get("GITHUB_TOKEN", "")
          omniroute_url = (os.environ.get("OMNIROUTE_BASE_URL") or "https://api.openai.com/v1").rstrip("/")
          omniroute_key = os.environ.get("OMNIROUTE_API_KEY", "")
          model = os.environ.get("MODEL", "auto/coding")

          if not token or not repo or pr_num <= 0:
              print("Missing review parameters. Exiting.")
              sys.exit(0)

          if not omniroute_key:
              if os.environ.get("IS_FORK", "false").lower() == "true":
                  print("No OMNIROUTE_API_KEY available on external fork PR. Exiting cleanly.")
              else:
                  print("::warning::OMNIROUTE_OPENHANDS_API_KEY / OMNIROUTE_API_KEY is missing in repository secrets; skipping AI PR review.")
              sys.exit(0)
          if not os.environ.get("OMNIROUTE_BASE_URL"):
              print("::warning::OMNIROUTE_BASE_URL is not set in repository secrets.")

          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github.v3+json", "User-Agent": "FaserF-Hermes-Reviewer"}
          owner, name = repo.split("/")
          start_time = time.time()
          marker = "<!-- hermes-ai-reviewer-status -->"
          status_cid = None

          # 0. Set or edit in-place status comment
          try:
              req_sc = urllib.request.Request(f"https://api.github.com/repos/{repo}/issues/{pr_num}/comments", headers=headers)
              with urllib.request.urlopen(req_sc, timeout=10) as sc_resp:
                  for sc in json.loads(sc_resp.read().decode()):
                      if marker in (sc.get("body") or ""):
                          status_cid = sc.get("id")
                          break
              in_prog_body = f"{marker}\n> 🔄 **FaserF Hermes Agent Reviewer:** Analysis in progress... (`0s` elapsed)  \n> **Engine:** OmniRoute (`{model}`) · Validating PR diff & fleet standards..."
              if status_cid:
                  req_p = urllib.request.Request(f"https://api.github.com/repos/{repo}/issues/comments/{status_cid}", headers=headers, data=json.dumps({"body": in_prog_body}).encode(), method="PATCH")
                  urllib.request.urlopen(req_p, timeout=10)
              else:
                  req_p = urllib.request.Request(f"https://api.github.com/repos/{repo}/issues/{pr_num}/comments", headers=headers, data=json.dumps({"body": in_prog_body}).encode())
                  with urllib.request.urlopen(req_p, timeout=10) as p_res:
                      status_cid = json.loads(p_res.read().decode()).get("id")
          except Exception as exc:
              print(f"Status start note: {exc}")

          # 1. Fetch PR details
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/pulls/{pr_num}", headers=headers)
          with urllib.request.urlopen(req) as resp:
              pr_data = json.loads(resp.read().decode())
          commit_sha = pr_data.get("head", {}).get("sha", "")
          pr_title = pr_data.get("title", "")

          if any(m in pr_title.lower() for m in ["[skip hermes]", "[skip review]", "[skip ci]"]):
              print(f"PR title '{pr_title}' contains skip marker. Skipping review.")
              sys.exit(0)

          # 2. Fetch PR diff
          diff_headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github.v3.diff", "User-Agent": "FaserF-Hermes-Reviewer"}
          req_diff = urllib.request.Request(f"https://api.github.com/repos/{repo}/pulls/{pr_num}", headers=diff_headers)
          try:
              with urllib.request.urlopen(req_diff) as resp:
                  diff_text = resp.read().decode()
          except Exception:
              diff_text = ""

          if not diff_text.strip():
              print("No diff to review.")
              sys.exit(0)

          # 2c. AI & Deterministic Secret Scanner: Scan PR diff for credentials & exposed keys
          secret_rules = [
              ("GitHub Token", r"gh[pousr]_[A-Za-z0-9_]{36,}"),
              ("AWS Access Key", r"AKIA[0-9A-Z]{16}"),
              ("Private Key", r"-----BEGIN (?:RSA|OPENSSH|EC|DSA|PGP|PRIVATE) KEY-----"),
              ("Slack Token", r"xox[baprs]-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24,32}"),
              ("Telegram Bot Token", r"[0-9]{8,10}:[a-zA-Z0-9_-]{35}"),
              ("Tailscale Key", r"tskey-(?:auth|client)-[a-zA-Z0-9]+"),
              ("Infisical Token", r"st\.[a-f0-9]{24,}\.[a-zA-Z0-9]{32,}"),
              ("Hardcoded Secret/Password", r"(?i)(?:api[_-]?key|secret|password|auth[_-]?token|access[_-]?token)\s*[:=]\s*['\"][A-Za-z0-9_\-.~!@#$%^&*+=]{14,}['\"]"),
          ]
          secret_findings = []
          curr_file = None
          curr_line = 0
          for d_line in diff_text.splitlines():
              if d_line.startswith("+++ b/"):
                  curr_file = d_line[6:].strip()
              elif d_line.startswith("@@"):
                  m = re.search(r"\+(\d+)", d_line)
                  if m:
                      curr_line = int(m.group(1)) - 1
              elif d_line.startswith("+") and not d_line.startswith("+++"):
                  curr_line += 1
                  added_text = d_line[1:]
                  if any(dummy in added_text.lower() for dummy in ["mock_", "fake_", "dummy_", "test_", "example", "placeholder", "xxx"]):
                      continue
                  for s_name, s_pat in secret_rules:
                      if re.search(s_pat, added_text):
                          secret_findings.append({
                              "path": curr_file or "unknown",
                              "line": curr_line,
                              "severity": "Critical",
                              "title": f"🚨 Security Alert: Leaked {s_name}",
                              "body": f"> [!CAUTION]\n> 🚨 **Critical Secret Exposure:** Hardcoded `{s_name}` found in added lines.\n> Never commit plaintext secrets to Git repositories.\n> 1. Revoke / rotate this credential immediately.\n> 2. Remove it from branch history (`git commit --amend` or rebase).\n> 3. Reference environment variables via `.env` / Infisical.",
                              "suggested_diff": "",
                              "agent_prompt": f"Remove {s_name} from {curr_file} and load securely from environment variable."
                          })
              elif not d_line.startswith("-"):
                  curr_line += 1

          # 2b. Check for existing CodeRabbit review findings (Platform API + GitHub comments)
          coderabbit_present, skip_or_limited = False, False
          cr_comments = []
          skip_markers = ("rate limit", "limit reached", "review skipped", "skipping review", "bot user detected", "trivial", "too small", "outside of the review scope", "not analyzing", "fewer than 10 stars", "10 stars")
          repo_id = str((pr_data.get("base") or {}).get("repo", {}).get("id") or "")
          cr_api_key = os.environ.get("CODERABBIT_API_KEY", "")

          if cr_api_key and repo_id:
              try:
                  req_cr_api = urllib.request.Request(
                      f"https://api.coderabbit.ai/v1/repositories/{repo_id}/pull-requests/{pr_num}/review/summary",
                      headers={"x-coderabbitai-api-key": cr_api_key, "User-Agent": "Jarvis-PR-Reviewer"}
                  )
                  with urllib.request.urlopen(req_cr_api, timeout=10) as cr_resp:
                      if cr_resp.status == 200:
                          cr_json = json.loads(cr_resp.read().decode())
                          summary_md = (cr_json.get("summary") or {}).get("body_markdown") or ""
                          if summary_md and not any(m in summary_md.lower() for m in skip_markers):
                              coderabbit_present = True
                              cr_comments.append({"path": "Repository", "line": 1, "body": summary_md[:300]})
                      elif cr_resp.status == 404:
                          skip_or_limited = True
              except Exception as exc:
                  print(f"CodeRabbit Platform API check note: {exc}")

          try:
              req_ic = urllib.request.Request(f"https://api.github.com/repos/{repo}/issues/{pr_num}/comments", headers=headers)
              with urllib.request.urlopen(req_ic, timeout=10) as c_resp:
                  for c in json.loads(c_resp.read().decode()):
                      u, b = ((c.get("user") or {}).get("login") or "").lower(), (c.get("body") or "").lower()
                      if "coderabbit" in u and any(m in b for m in skip_markers):
                          skip_or_limited = True
          except Exception:
              pass

          try:
              req_rv = urllib.request.Request(f"https://api.github.com/repos/{repo}/pulls/{pr_num}/reviews", headers=headers)
              with urllib.request.urlopen(req_rv, timeout=10) as r_resp:
                  for r in json.loads(r_resp.read().decode()):
                      u, b = ((r.get("user") or {}).get("login") or "").lower(), (r.get("body") or "").lower()
                      if "coderabbit" in u:
                          if any(m in b for m in skip_markers):
                              skip_or_limited = True
                          elif r.get("state") in ("APPROVED", "CHANGES_REQUESTED", "COMMENTED"):
                              coderabbit_present = True
          except Exception:
              pass

          if not skip_or_limited:
              try:
                  req_cm = urllib.request.Request(f"https://api.github.com/repos/{repo}/pulls/{pr_num}/comments", headers=headers)
                  with urllib.request.urlopen(req_cm, timeout=10) as c_resp:
                      for c in json.loads(c_resp.read().decode()):
                          if "coderabbit" in ((c.get("user") or {}).get("login") or "").lower():
                              coderabbit_present = True
                              cr_comments.append({"path": c.get("path"), "line": c.get("line"), "body": (c.get("body") or "")[:200]})
              except Exception:
                  pass

          cr_text = ""
          if coderabbit_present and cr_comments and not skip_or_limited:
              items = "\n".join(f"- `{c.get('path')}:{c.get('line')}`: {c.get('body')}" for c in cr_comments[:6])
              cr_text = f"\nExisting CodeRabbit findings on this PR:\n{items}\nDirectives: Never duplicate. Confirm/refute in short_summary. Add only new deep findings.\n"

          # 3. Call OmniRoute Review Engine (100% Repowise & CodeRabbit Parity)
          review_prompt = f"""You are FaserF Hermes Agent Reviewer, providing 100% parity with CodeRabbit AI and Repowise Bot for @FaserF repositories.
          Analyze this Pull Request diff. Return strictly valid JSON:
          {{
            "event": "APPROVE" | "REQUEST_CHANGES" | "COMMENT",
            "short_summary": "1-2 sentence overview of implementation.",
            "health_score": {{"before": 9.20, "after": 9.15, "delta": -0.05, "rating": "Healthy"}},
            "test_estimate": "Summary of touched files covered by tests vs untested complexity.",
            "hygiene_notes": ["Untested complexity in ...", "Complex methods in ..."],
            "walkthrough_table": [{{"component": "Core", "file": "path/file.ext", "summary": "what changed"}}],
            "findings": [
              {{
                "path": "path/to/file.ext",
                "line": 10,
                "severity": "Major" | "Minor" | "Suggestion",
                "title": "Short title",
                "body": "Explanation of issue.",
                "suggested_diff": "```diff\\n- old\\n+ new\\n```",
                "agent_prompt": "Imperative instruction for an AI agent to fix."
              }}
            ]
          }}
          max_diff_len = 64000
          is_diff_truncated = len(diff_text) > max_diff_len
          analyzed_diff = diff_text[:max_diff_len]

          Diff:
          ```diff
          {analyzed_diff}
          ```
          {cr_text}"""

          llm_headers = {"Authorization": f"Bearer {omniroute_key}", "Content-Type": "application/json"}
          llm_payload = json.dumps({"model": model, "messages": [{"role": "user", "content": review_prompt}], "temperature": 0.1}).encode()

          try:
              llm_req = urllib.request.Request(f"{omniroute_url}/chat/completions", headers=llm_headers, data=llm_payload)
              with urllib.request.urlopen(llm_req, timeout=180) as resp:
                  llm_resp = json.loads(resp.read().decode())
              raw_out = llm_resp["choices"][0]["message"]["content"].strip()
              if raw_out.startswith("```"):
                  raw_out = "\n".join(raw_out.splitlines()[1:-1] if raw_out.splitlines()[-1].startswith("```") else raw_out.splitlines()[1:]).strip()
              parsed = json.loads(raw_out)
          except Exception as exc:
              print(f"OmniRoute review generation skipped: {exc}")
              parsed = {"event": "COMMENT", "short_summary": f"Automated hygiene verification incomplete: {exc}", "findings": []}

          findings = secret_findings + parsed.get("findings", [])
          if secret_findings:
              event = "REQUEST_CHANGES"
          else:
              event = parsed.get("event", "APPROVE" if not findings else "REQUEST_CHANGES")

          # 4. GraphQL: Auto-resolve addressed threads
          active_keys = {(f.get("path"), f.get("line")) for f in findings}
          query_threads = """query($owner: String!, $name: String!, $pr: Int!) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $pr) {
                reviewThreads(first: 50) {
                  nodes {
                    id
                    isResolved
                    path
                    line
                    comments(first: 1) { nodes { author { login } } }
                  }
                }
              }
            }
          }"""
          gql_headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          try:
              gql_req = urllib.request.Request("https://api.github.com/graphql", headers=gql_headers, data=json.dumps({"query": query_threads, "variables": {"owner": owner, "name": name, "pr": pr_num}}).encode())
              with urllib.request.urlopen(gql_req, timeout=15) as g_resp:
                  g_data = json.loads(g_resp.read().decode())
              threads = g_data.get("data", {}).get("repository", {}).get("pullRequest", {}).get("reviewThreads", {}).get("nodes", [])

              mutation_resolve = """mutation($threadId: ID!) { resolveReviewThread(input: { threadId: $threadId }) { thread { id isResolved } } }"""
              for t in threads:
                  if not t.get("isResolved"):
                      author = ((t.get("comments", {}).get("nodes") or [{}])[0].get("author") or {}).get("login", "")
                      if "faserf-hermes-agent" in author or "hermes" in author:
                          if (t.get("path"), t.get("line")) not in active_keys and t.get("id"):
                              m_req = urllib.request.Request("https://api.github.com/graphql", headers=gql_headers, data=json.dumps({"query": mutation_resolve, "variables": {"threadId": t["id"]}}).encode())
                              try:
                                  urllib.request.urlopen(m_req, timeout=10)
                                  print(f"Auto-resolved thread {t['id']} on {t.get('path')}:{t.get('line')}")
                              except Exception:
                                  pass
          except Exception as exc:
              print(f"GraphQL thread resolution note: {exc}")

          # 5. Build Top Level Body with Quick Actions, Repowise Health & Single Consolidated Prompt
          health = parsed.get("health_score", {})
          h_before = float(health.get("before", 9.15))
          h_after = float(health.get("after", round(max(5.0, h_before - 0.02 * len(findings)), 2)))
          delta = float(health.get("delta", round(h_after - h_before, 2)))
          rating = health.get("rating") or ("Healthy" if h_after >= 8.5 else "Moderate" if h_after >= 7.0 else "Needs Attention")
          rating_icon = "🟢" if h_after >= 8.5 else "🟡" if h_after >= 7.0 else "🔴"
          test_est = parsed.get("test_estimate") or f"{len(parsed.get('walkthrough_table', []))} file(s) touched. Tests estimated based on diff."
          hygiene_notes = parsed.get("hygiene_notes", [])

          body_lines = [
              f"<!-- hermes-ai-review:v3 " + json.dumps({"commit": commit_sha[:8], "health": h_after, "delta": delta, "rating": rating}) + " -->",
              "> [!NOTE]",
              "> 🤖 **Automated Code Review by Private Fleet AI**  ",
              "> **Reviewer:** [faserf-hermes-agent[bot]](https://github.com/apps/faserf-hermes-agent) on behalf of maintainer @FaserF  ",
              "> **Engine:** OmniRoute (`" + model + "`) · 100% Repowise, CodeRabbit & GitDocify Parity  ",
              "> *This automated review assists maintainers with quality gates. Maintainers make the final merge decision.*\n",
              "### ⚡ Quick Actions & Bot Controls",
              "- [ ] 🔄 Request re-review (`@faserf-hermes-agent review` / `@faserf-hermes-agent recheck`)",
              "- [ ] 📚 Update docs & README (`@faserf-hermes-agent doc`)",
              "- [ ] ⚡ Auto-fix all findings via OpenHands (`@faserf-hermes-agent resolve`)",
              "- [ ] ⏸️ Pause automated reviews\n",
              "### 📊 Codebase Health & Test Coverage (Repowise Parity)",
              f"**Health of changed files: `{h_before:.2f} → {h_after:.2f} ({delta:+.2f})`** · Rating: {rating_icon} **{rating}**  ",
              f"* **Tests (estimate):** {test_est}",
          ]
          if secret_findings:
              body_lines.insert(6, f"> [!CAUTION]\n> 🚨 **SECURITY ALERT:** {len(secret_findings)} exposed credential(s) detected in this PR diff! Approval blocked until rotated and purged.\n")
          if hygiene_notes:
              body_lines.append(f"* **Worth a look:** {'; '.join(hygiene_notes[:4])}")
          if is_diff_truncated:
              body_lines.append(f"> ⚠️ **Large Diff Truncated:** Changes exceeded the 64KB single-turn threshold ({len(diff_text)} bytes). The review covers the first 64KB; critical changes beyond this threshold should receive manual maintainer verification.")
          body_lines.append("")
          if coderabbit_present and cr_comments and not skip_or_limited:
              body_lines.append(f"### 🤝 CodeRabbit Co-Review Reconciliation\n- **Analysis:** Reconciled {len(cr_comments)} existing CodeRabbit comment(s). Zero duplicate findings posted.\n- **Complementary Findings:** {len(findings)} new item(s) identified below.\n")
          body_lines.append("## Findings")
          if findings:
              for f in findings:
                  body_lines.append(f"- **`{f.get('path')}:{f.get('line')}`**: **{f.get('title')}** ({f.get('severity', 'Minor')})")
              body_lines.append("")
          else:
              body_lines.append("✅ **No defects detected.** All changes adhere to fleet hygiene and health standards.\n")

          # Walkthrough
          body_lines.append("<details><summary><strong>Walkthrough</strong></summary><dl><dd>\n")
          body_lines.append(parsed.get("short_summary", "") + "\n\n| File | Summary |\n|:---|:---|")
          for w in parsed.get("walkthrough_table", []):
              body_lines.append(f"| `{w.get('file')}` | {w.get('summary')} |")
          body_lines.append("\n</dd></dl></details>\n")

          # Single consolidated copy prompt at end of walkthrough
          if findings:
              task_items = []
              for i, f in enumerate(findings, 1):
                  desc = f.get("agent_prompt") or f.get("body", "")
                  task_items.append(f"{i}. File `{f.get('path')}` (line {f.get('line')}): {f.get('title')}\n   Action: {desc}")
              body_lines.extend([
                  "<details><summary>🤖 <strong>Prompt for AI Agent (Copy & Paste to fix all active findings)</strong></summary><dl><dd>\n",
                  "```markdown\nReview findings to fix on this PR:\n" + "\n".join(task_items) + "\n\nInstructions for AI Agent:\n" +
                  "1. Fix only still-valid issues listed above; keep changes minimal.\n" +
                  "2. Ensure source files stay <= 600 lines; preserve exception tracebacks (no `except: pass`, no `raise e`).\n" +
                  "3. Run existing tests and linting to verify fixes pass before committing.\n" +
                  "4. Commit with conventional commit format (e.g. `fix: address PR review findings`).\n```\n</dd></dl></details>\n"
              ])

          body_lines.append("---\n**Decision:** `" + event + "` | **Reviewer:** FaserF Hermes Agent Bot")
          top_body = "\n".join(body_lines)

          # 6. Build Inline Comments with ```suggestion blocks
          inline_comments = []
          for f in findings:
              p, l = f.get("path"), int(f.get("line") or 1)
              comment_lines = [
                  "<!-- hermes-ai-generated:v2 -->\n",
                  f"**{f.get('severity', 'Minor')}** · **{f.get('title')}**\n",
                  f.get("body", "").strip(),
              ]
              diff = f.get("suggested_diff", "").strip()
              if diff:
                  clean = [ln[1:] if ln.startswith("+") else ln for ln in diff.splitlines() if not ln.startswith("```") and not ln.startswith("-")]
                  sugg = "\n".join(clean).strip()
                  if sugg:
                      comment_lines.append(f"\n```suggestion\n{sugg}\n```")
              inline_comments.append({"path": p, "line": l, "side": "RIGHT", "body": "\n".join(comment_lines)})

          # 7. Submit Review
          review_payload = {"commit_id": commit_sha, "body": top_body, "event": event}
          if inline_comments:
              review_payload["comments"] = inline_comments

          submit_req = urllib.request.Request(f"https://api.github.com/repos/{repo}/pulls/{pr_num}/reviews", headers=headers, data=json.dumps(review_payload).encode())
          try:
              urllib.request.urlopen(submit_req)
              print(f"Submitted PR review on #{pr_num} ({event}) with {len(inline_comments)} inline findings.")
          except urllib.error.HTTPError as he:
              print(f"Batch review fallback: {he.code}")
              fallback = {"commit_id": commit_sha, "body": top_body, "event": event}
              urllib.request.urlopen(urllib.request.Request(f"https://api.github.com/repos/{repo}/pulls/{pr_num}/reviews", headers=headers, data=json.dumps(fallback).encode()))

          # 8. Update in-place status comment to finished
          elapsed = int(time.time() - start_time)
          done_body = f"{marker}\n> ✅ **FaserF Hermes Agent Reviewer:** Review completed in `{elapsed}s`.  \n> **Verdict:** `{event}` ({len(findings)} findings, {len(inline_comments)} inline suggestions) · Co-Review: {'CodeRabbit Reconciled' if cr_comments else 'Independent Analysis'}"
          try:
              if status_cid:
                  req_done = urllib.request.Request(f"https://api.github.com/repos/{repo}/issues/comments/{status_cid}", headers=headers, data=json.dumps({"body": done_body}).encode(), method="PATCH")
                  urllib.request.urlopen(req_done, timeout=10)
          except Exception as exc:
              print(f"Status finish note: {exc}")
          EOF

      - name: Execute PR Review
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
          BOT_TOKEN: ${{ steps.app-token.outputs.token }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_OPENHANDS_API_KEY || secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_BASE_URL: ${{ inputs.omniroute_base_url != '' && inputs.omniroute_base_url || secrets.OMNIROUTE_BASE_URL }}
          CODERABBIT_API_KEY: ${{ secrets.CODERABBIT_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          python run_pr_review.py || true
