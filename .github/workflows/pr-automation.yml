name: PR Automation

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-pr-auto
  cancel-in-progress: true

jobs:
  automate:
    name: PR Automation Tasks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]' && !endsWith(github.actor, '[bot]')
    steps:
      - name: Generate Bot Token
        id: app-token
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Fix line endings (CRLF -> LF) in shell scripts
        run: |
          find . -name "*.sh" ! -path "./.git/*" ! -path "./node_modules/*" -exec sed -i 's/\r$//' {} +

      - name: Commit auto-fixes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: fix line endings in shell scripts [skip ci]"
          commit_user_name: "faserf-hermes-agent[bot]"
          commit_user_email: "342667397+faserf-hermes-agent[bot]@users.noreply.github.com"
          branch: ${{ github.head_ref }}
          file_pattern: "*.sh"
