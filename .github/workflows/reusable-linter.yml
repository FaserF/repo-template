name: Reusable Linter Workflow

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner environment ('ubuntu-latest', 'self-hosted', or 'auto')"
        type: string
        default: "auto"

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || ((inputs.runner == 'self-hosted' || vars.FORCE_SELF_HOSTED_RUNNER == 'true' || vars.USE_SELF_HOSTED_RUNNERS == 'true' || vars.USE_GITHUB_RUNNERS == 'false') && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest') }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ruff Linter & Formatter (Python)
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --select E,F,W,C90,I,UP --ignore E501"

      - name: Actionlint (GitHub Actions Workflows)
        uses: raven-actions/actionlint@v2
        continue-on-error: true
