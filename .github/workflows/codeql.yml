name: CodeQL

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".github/workflows/**"
  schedule:
    - cron: "30 1 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-codeql
  cancel-in-progress: true

jobs:
  detect-and-scan:
    name: CodeQL Auto-Detect
    if: github.event.repository.private != true
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Detect Primary Language
        id: lang
        run: |
          if ls ./*.sln >/dev/null 2>&1 || ls ./*/*.csproj >/dev/null 2>&1; then
            echo "language=csharp" >> "$GITHUB_OUTPUT"
          elif [ -f "go.mod" ]; then
            echo "language=go" >> "$GITHUB_OUTPUT"
          elif [ -f "package.json" ]; then
            echo "language=javascript-typescript" >> "$GITHUB_OUTPUT"
          elif [ -f "pyproject.toml" ] || [ -f "requirements.txt" ] || [ -d "custom_components" ]; then
            echo "language=python" >> "$GITHUB_OUTPUT"
          else
            echo "language=" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize CodeQL
        if: steps.lang.outputs.language != ''
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ steps.lang.outputs.language }}

      - name: Perform CodeQL Analysis
        if: steps.lang.outputs.language != ''
        uses: github/codeql-action/analyze@v4
