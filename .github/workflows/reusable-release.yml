name: Reusable Release Workflow

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v1.2.0)"
        type: string
        required: false
      release_type:
        description: "Optional version bump level for workflow_dispatch (patch, minor, major)"
        type: string
        default: ""
      draft:
        description: "Create as draft release"
        type: boolean
        default: false
      floating_major_tag:
        description: "Update floating major version tag (e.g. v1) - enable for GitHub Actions, disable for HA integrations"
        type: boolean
        default: false
      runner:
        description: "Runner environment ('ubuntu-latest', 'self-hosted', or 'auto')"
        type: string
        default: "auto"

jobs:
  release:
    name: Create GitHub Release
    timeout-minutes: 10
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || ((inputs.runner == 'self-hosted' || github.event.repository.private == true || vars.FORCE_SELF_HOSTED_RUNNER == 'true' || vars.USE_SELF_HOSTED_RUNNERS == 'true' || vars.USE_GITHUB_RUNNERS == 'false') && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest') }}
    permissions:
      contents: write
    steps:
      - name: Generate Bot Token
        id: app-token
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Bump Version & Push Tag (Centralized)
        id: bump
        if: inputs.release_type != ''
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -f .github/scripts/version_manager.py ]; then
            NEW_VER=$(python3 .github/scripts/version_manager.py bump --type stable --level "$RELEASE_TYPE")
          else
            NEW_VER=$(python3 - <<'PY'
          import glob, json, os, re, subprocess
          from pathlib import Path
          level = os.environ.get("RELEASE_TYPE", "patch")
          tags = subprocess.check_output(["git", "tag", "--sort=-version:refname"], text=True).splitlines()
          latest = next((t.lstrip("v") for t in tags if re.match(r"^v?\d+\.\d+\.\d+$", t.strip())), "1.0.0")
          maj, min_, pat = (int(x) for x in latest.split("."))
          if level == "major":
              maj, min_, pat = maj + 1, 0, 0
          elif level == "minor":
              min_, pat = min_ + 1, 0
          else:
              pat += 1
          ver = f"{maj}.{min_}.{pat}"
          for mf in glob.glob("custom_components/*/manifest.json"):
              data = json.loads(Path(mf).read_text(encoding="utf-8"))
              data["version"] = ver
              Path(mf).write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          if Path("pyproject.toml").is_file():
              txt = Path("pyproject.toml").read_text(encoding="utf-8")
              txt = re.sub(r'^version\s*=\s*".*?"', f'version = "{ver}"', txt, count=1, flags=re.MULTILINE)
              Path("pyproject.toml").write_text(txt, encoding="utf-8")
          if Path("package.json").is_file():
              pkg = json.loads(Path("package.json").read_text(encoding="utf-8"))
              if "version" in pkg:
                  pkg["version"] = ver
                  Path("package.json").write_text(json.dumps(pkg, indent=2) + "\n", encoding="utf-8")
          print(ver)
          PY
            )
          fi
          TAG="v${NEW_VER}"
          git config user.name "faserf-hermes-agent[bot]"
          git config user.email "342667397+faserf-hermes-agent[bot]@users.noreply.github.com"
          git add custom_components/*/manifest.json pyproject.toml package.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore(release): ${TAG} [skip ci]"
          git tag -f "${TAG}"
          git push origin "HEAD:${REF_NAME}"
          git push origin "${TAG}" --force
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate Changelog for GitHub Release
        id: changelog
        shell: bash
        run: |
          TARGET_TAG="${{ steps.bump.outputs.tag_name || inputs.tag_name || github.ref_name }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | grep -v "^$TARGET_TAG$" | head -n 1 || true)
          echo "Target tag: $TARGET_TAG, Previous tag: $PREV_TAG"
          
          if [ -f scripts/generate_changelog.py ]; then
            python3 scripts/generate_changelog.py --from-tag "$PREV_TAG" --repo "${{ github.repository }}" > /tmp/gh_release_body.md
          else
            curl -fsSL https://raw.githubusercontent.com/FaserF/repo-template/main/scripts/generate_changelog.py -o /tmp/generate_changelog.py
            python3 /tmp/generate_changelog.py --from-tag "$PREV_TAG" --repo "${{ github.repository }}" > /tmp/gh_release_body.md
          fi
          
          echo "Generated release body preview:"
          head -n 25 /tmp/gh_release_body.md

      - name: Package HACS Zip Release
        id: hacs-zip
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          import zipfile
          from pathlib import Path

          files_out = ""
          if Path("hacs.json").is_file():
              hacs_cfg = json.loads(Path("hacs.json").read_text(encoding="utf-8"))
              if hacs_cfg.get("zip_release"):
                  manifests = glob.glob("custom_components/*/manifest.json")
                  if manifests:
                      manifest = json.loads(Path(manifests[0]).read_text(encoding="utf-8"))
                      domain = manifest["domain"]
                      zip_name = hacs_cfg.get("filename") or f"{domain}.zip"
                      comp_dir = Path(manifests[0]).parent
                      with zipfile.ZipFile(zip_name, "w", zipfile.ZIP_DEFLATED) as zf:
                          for p in sorted(comp_dir.rglob("*")):
                              if p.is_file() and "__pycache__" not in p.parts and p.suffix != ".pyc":
                                  zf.write(p, p.relative_to(comp_dir))
                      files_out = zip_name
                      print(f"Packaged HACS release archive: {zip_name}")

          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a", encoding="utf-8") as fh:
                  fh.write(f"files={files_out}\n")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.bump.outputs.tag_name || inputs.tag_name || github.ref_name }}
          name: ${{ steps.bump.outputs.tag_name || inputs.tag_name || github.ref_name }}
          body_path: /tmp/gh_release_body.md
          files: ${{ steps.hacs-zip.outputs.files }}
          draft: ${{ inputs.draft }}

      - name: Update Floating Major Version Tag
        if: inputs.floating_major_tag == true
        shell: bash
        run: |
          TAG="${{ steps.bump.outputs.tag_name || inputs.tag_name || github.ref_name }}"
          if [[ "$TAG" =~ ^v([0-9]+)\. ]]; then
            MAJOR="v${BASH_REMATCH[1]}"
            echo "Updating floating major tag $MAJOR -> $TAG"
            git config user.name "faserf-hermes-agent[bot]"
            git config user.email "342667397+faserf-hermes-agent[bot]@users.noreply.github.com"
            git tag -fa "$MAJOR" -m "Release $TAG (floating major tag $MAJOR)"
            git push origin "$MAJOR" --force
          fi
