name: Reusable Release Workflow

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v1.2.0)"
        type: string
        required: false
      draft:
        description: "Create as draft release"
        type: boolean
        default: false
      runner:
        description: "Runner environment ('ubuntu-latest', 'self-hosted', or 'auto')"
        type: string
        default: "auto"

jobs:
  release:
    name: Create GitHub Release
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || ((inputs.runner == 'self-hosted' || vars.FORCE_SELF_HOSTED_RUNNER == 'true' || vars.USE_SELF_HOSTED_RUNNERS == 'true' || vars.USE_GITHUB_RUNNERS == 'false') && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest') }}
    permissions:
      contents: write
    steps:
      - name: Generate Bot Token
        id: app-token
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Generate Changelog & Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          draft: ${{ inputs.draft }}
