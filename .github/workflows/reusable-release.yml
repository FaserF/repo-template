name: Reusable Release Workflow

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Explicit tag name (for v* tag pushes or re_release target)"
        type: string
        default: ""
      channel:
        description: "Release channel (stable, beta, nightly)"
        type: string
        default: "stable"
      bump_level:
        description: "SemVer bump increment (patch, minor, major)"
        type: string
        default: "patch"
      release_type:
        description: "Legacy alias for bump_level or channel"
        type: string
        default: ""
      version_override:
        description: "Force explicit target version (e.g. 1.2.3 or 2026.11.0b1)"
        type: string
        default: ""
      re_release:
        description: "Re-release / update existing tag & GitHub release without bumping version"
        type: boolean
        default: false
      custom_message:
        description: "Optional highlight message prepended to release notes"
        type: string
        default: ""
      draft:
        description: "Create as draft release"
        type: boolean
        default: false
      prerelease:
        description: "Prerelease flag override (auto, true, false)"
        type: string
        default: "auto"
      floating_major_tag:
        description: "Update floating major version tag (e.g. v1) on stable releases"
        type: boolean
        default: false
      post_dev_bump:
        description: "Bump repository version to next -dev0 after stable release"
        type: boolean
        default: false
      runner:
        description: "Runner environment ('ubuntu-latest', 'self-hosted', or 'auto')"
        type: string
        default: "auto"

jobs:
  release:
    name: Create GitHub Release
    timeout-minutes: 15
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || ((inputs.runner == 'self-hosted' || github.event.repository.private == true || vars.FORCE_SELF_HOSTED_RUNNER == 'true' || vars.USE_SELF_HOSTED_RUNNERS == 'true' || vars.USE_GITHUB_RUNNERS == 'false') && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest') }}
    permissions:
      contents: write
    steps:
      - name: Generate Bot Token
        id: app-token
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          ref: ${{ inputs.tag_name || '' }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Load Central Release Helpers
        shell: bash
        run: |
          mkdir -p /tmp/fleet-scripts
          for f in version_manager.py release_details.py generate_changelog.py update_templates.py; do
            if [ -f "scripts/$f" ]; then
              cp "scripts/$f" "/tmp/fleet-scripts/$f"
            elif [ -f ".github/scripts/$f" ]; then
              cp ".github/scripts/$f" "/tmp/fleet-scripts/$f"
            else
              curl -fsSL "https://raw.githubusercontent.com/FaserF/repo-template/main/scripts/$f" -o "/tmp/fleet-scripts/$f" || true
            fi
          done
          cp /tmp/fleet-scripts/generate_changelog.py /tmp/generate_changelog.py 2>/dev/null || true

      - name: Resolve Version, Channel & Changelog Details
        id: meta
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          CHANNEL: ${{ (inputs.release_type == 'beta' || inputs.release_type == 'nightly' || inputs.release_type == 'stable') && inputs.release_type || inputs.channel }}
          BUMP_LEVEL: ${{ (inputs.release_type == 'patch' || inputs.release_type == 'minor' || inputs.release_type == 'major') && inputs.release_type || inputs.bump_level }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
          RE_RELEASE: ${{ inputs.re_release }}
          CUSTOM_MESSAGE: ${{ inputs.custom_message }}
          PRERELEASE_FLAG: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          PYTHONPATH=/tmp/fleet-scripts python3 /tmp/fleet-scripts/release_details.py

      - name: Bump Version, Templates & Tag (When Not Re-Release)
        id: tagstep
        if: inputs.re_release != true && (inputs.tag_name == '' || inputs.version_override != '')
        env:
          TARGET_VER: ${{ steps.meta.outputs.version }}
          TARGET_TAG: ${{ steps.meta.outputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          PYTHONPATH=/tmp/fleet-scripts DRY_RUN="" python3 -c "
          import os, version_manager
          version_manager.write_version(os.environ['TARGET_VER'])
          "
          if [ -f /tmp/fleet-scripts/update_templates.py ]; then
            python3 /tmp/fleet-scripts/update_templates.py "$TARGET_VER" || true
          fi
          git config user.name "faserf-hermes-agent[bot]"
          git config user.email "342667397+faserf-hermes-agent[bot]@users.noreply.github.com"
          git add custom_components/*/manifest.json pyproject.toml package.json config.yaml .github/ISSUE_TEMPLATE/*.y*ml 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore(release): ${TARGET_TAG} [skip ci]"
          git tag -f "$TARGET_TAG"
          git push origin "HEAD:${REF_NAME}"
          git push origin "$TARGET_TAG" --force
          echo "created_tag=${TARGET_TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout Re-Release Tag
        if: inputs.re_release == true && steps.meta.outputs.tag != ''
        env:
          TARGET_TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          if git rev-parse -q --verify "refs/tags/${TARGET_TAG}" >/dev/null; then
            git checkout "$TARGET_TAG"
          fi

      - name: Package HACS Zip Release
        id: hacs-zip
        env:
          TARGET_VER: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, json, os, zipfile
          from pathlib import Path

          files_out = ""
          if Path("hacs.json").is_file():
              hacs_cfg = json.loads(Path("hacs.json").read_text(encoding="utf-8"))
              if hacs_cfg.get("zip_release"):
                  manifests = glob.glob("custom_components/*/manifest.json")
                  if manifests:
                      manifest_data = json.loads(Path(manifests[0]).read_text(encoding="utf-8"))
                      domain = manifest_data["domain"]
                      expected_ver = os.environ.get("TARGET_VER", "").lstrip("vV")
                      actual_ver = str(manifest_data.get("version", "")).lstrip("vV")
                      if expected_ver and actual_ver != expected_ver:
                          raise SystemExit(
                              f"Manifest version mismatch in {manifests[0]}: expected {expected_ver!r}, found {actual_ver!r}"
                          )
                      zip_name = hacs_cfg.get("filename") or f"{domain}.zip"
                      comp_dir = Path(manifests[0]).parent
                      with zipfile.ZipFile(zip_name, "w", zipfile.ZIP_DEFLATED) as zf:
                          for p in sorted(comp_dir.rglob("*")):
                              if p.is_file() and "__pycache__" not in p.parts and p.suffix != ".pyc":
                                  zf.write(p, p.relative_to(comp_dir))
                      files_out = zip_name
                      print(f"Packaged HACS release archive: {zip_name} (version {actual_ver})")
          if gh_out := os.environ.get("GITHUB_OUTPUT"):
              with open(gh_out, "a", encoding="utf-8") as fh:
                  fh.write(f"files={files_out}\n")
          PY

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: /tmp/gh_release_body.md
          files: ${{ steps.hacs-zip.outputs.files }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          overwrite_files: true

      - name: Update Floating Major Version Tag
        if: inputs.floating_major_tag == true && inputs.draft != true && steps.meta.outputs.is_prerelease != 'true' && !startsWith(steps.meta.outputs.tag, 'v0.')
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if [[ "$TAG" =~ ^v([0-9]+)\. ]]; then
            MAJOR="v${BASH_REMATCH[1]}"
            echo "Updating floating major tag $MAJOR -> $TAG"
            git config user.name "faserf-hermes-agent[bot]"
            git config user.email "342667397+faserf-hermes-agent[bot]@users.noreply.github.com"
            git tag -fa "$MAJOR" -m "Release $TAG (floating major tag $MAJOR)"
            git push origin "$MAJOR" --force
          fi

      - name: Optional Post-Release Dev Bump
        if: inputs.post_dev_bump == true && inputs.re_release != true && steps.meta.outputs.is_prerelease != 'true' && inputs.draft != true
        env:
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          NEW_DEV=$(PYTHONPATH=/tmp/fleet-scripts python3 /tmp/fleet-scripts/version_manager.py bump --type dev --level patch)
          if [ -f /tmp/fleet-scripts/update_templates.py ]; then
            python3 /tmp/fleet-scripts/update_templates.py "$NEW_DEV" || true
          fi
          git config user.name "faserf-hermes-agent[bot]"
          git config user.email "342667397+faserf-hermes-agent[bot]@users.noreply.github.com"
          git add custom_components/*/manifest.json pyproject.toml package.json config.yaml .github/ISSUE_TEMPLATE/*.y*ml 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(dev): bump to ${NEW_DEV} [skip ci]"
            git push origin "HEAD:${REF_NAME}"
          fi

      - name: Rollback Created Tag on Failure
        if: failure() && steps.tagstep.outcome == 'success' && steps.tagstep.outputs.created_tag != '' && inputs.re_release != true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tagstep.outputs.created_tag }}
        shell: bash
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true
